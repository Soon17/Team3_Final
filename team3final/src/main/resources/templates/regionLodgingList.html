<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8">

  </style>
</head>

<body>
  <div class="swiper-wrapper swiper-lodging">
    <div class="swiper-slide" th:each="ld : ${lodgingList}">
      <a class="card reserv-link" style="border: 0; overflow: hidden;" href="#" th:data-ld-num="${ld.ld_num}"
        th:data-ld-region="${ld.ld_region}">
        <img th:src="@{${ld.main_thumbnail} + ${ld.th_name}}" class="card-img-top"
          style="max-width: 240px; width: 100%; height: 240px; border-radius: 16px;" alt="썸네일">
        <div class="card-body p-2">
          <h6 class="mb-1 fw-bold lodging-name" th:text="${ld.ld_name}"></h6>
          <div>
            <img src="/resources/static/imgs/rating.jpg" style=" width: 16px; height: 16px;">
            <span class="mb-0 text-muted" style="font-weight: 700;">[[${ld.avg_rating}]] </span>
            <span class="mb-0 text-muted" style="font-size: 14px;" th:if="${ld.ld_type == '호텔'}">| [[${ld.ld_rating}]]성급</span>
          </div>
          <p class="mb-0" th:text="|${#numbers.formatInteger(ld.min_price, 3, 'COMMA')}원|"
            style="font-size: 18px; font-weight: 700; color: #9f1f13;"></p>
        </div>
      </a>
    </div>
</body>

</html>
