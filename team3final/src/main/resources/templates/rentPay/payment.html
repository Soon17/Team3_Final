<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout.html}" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<title>결제</title>
	
	<style>
		.payment-images {
			display: flex;
			justify-content: center;
			align-items: center;
			gap: 30px; /* 이미지 사이 간격 */
			flex-wrap: wrap; /* 화면 작을 때 줄바꿈 */
		}

		.payment-images img {
			max-width: 150px; /* 이미지 최대 너비 제한 */
			height: auto;
			transition: transform 0.3s ease;
			cursor: pointer;
		}

		.payment-images img:hover {
			transform: scale(1.05); /* 마우스 올렸을 때 약간 확대 */
		}
		.toss-pay {
			border-radius: 30px;
			background-color: #e6f0ff; /* 토스 느낌의 연한 파랑 배경 */
		}
		.main-container {
			background-color: #f5f6f7;
			font-family: 'Noto Sans KR', sans-serif;
		}

		.container-box {
			background-color: #fff;
			padding: 30px;
			border-radius: 10px;
			box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
			width: 100%;
			max-width: 100%;
		}

		h5 {
			font-size: 20px !important;
			font-weight: bold;
		}

		.row {
			max-width: 1032px;
			display: flex;
			justify-content: center;
			flex-wrap: nowrap;
			margin-top: 30px;
			margin-bottom: 150px;
		}

		.in {
			margin-top: 50px;
			margin-bottom: 10px;
		}

		.option-label {
			color: #333;
			font-size: 15px;
			font-weight: 400;
			margin-left: 6px;
			cursor: pointer;
			user-select: none;
		}

		.form-check {
			display: flex;
			align-items: center;
		}

		.form-check-input {
			width: 16px;
			height: 16px;
			margin-top: 0;
			margin-right: 0;
			transform: translateY(-4px);
			/*체크박스 위치조절*/
			cursor: pointer;
		}

		.form-check-input:checked+.option-label {
			color: #007BFF;
			font-weight: 500;
		}

		@media screen and (max-width:990px) {
			footer {
				display: none;
			}

			.row {
				flex-direction: column;
				align-items: center;
				padding: 0;
				margin: 0 auto;
			}

			.container-box {
				padding: 20px;
				margin-right: 0 !important;
				margin-bottom: 70px;
				margin-top: 10px;
				width: 100%;
				max-width: 640px;
			}

		}
	</style>
</head>

<body>
	<main layout:fragment="content" class="main-container">
		<div class="container mb-5">
			<!-- 왼쪽 데이터 시작-->
			<div class="row">
				<div class="col-md-7 container-box mr-3">
					<form>
						<small class="text-muted">ct_type</small>
						<h5 class="d-flex justify-content-between align-items-center border-bottom pb-3 mt-1 mb-2"
							style="font-size: 20px">ct_name</h5>
						<div class="d-flex justify-content-center align-items-center border-bottom pb-2" style="gap: 32px;">
							<div class="text-center mx-5">
								<small class="text-muted">대여일</small>
								<div style="font-weight: bold;" class="check-in">checkIn</div>
								<div style="font-size: 0.9rem;">15:00 ~</div>
							</div>
							<div class="text-center mx-5">
								<span class="badge badge-light night">1박</span>
							</div>
							<div class="text-center mx-5" >
								<small class="text-muted">반납일</small>
								<div style="font-weight: bold;"  class="check-out">checkOUt</div>
								<div style="font-size: 0.9rem;">11:00 까지</div>
							</div>
						</div>
						<div class="d-flex align-items-center pt-3">
							<div style="font-weight: bold; margin-right: 100px;">보험정보</div>
							<div class="rm-name" >보험 이름 가격</div>
						</div>
					</form>
					<form id="reservationForm">
						<h5 class="in">운전자 정보</h5>
						<div class="form-group">
							<label>이름</label>
							<input type="text" name="reserverName" class="form-control" placeholder="성명">
							<div class="invalid-feedback">이름을 정확히 입력해주세요.</div>
						</div>
						<div class="form-group">
							<label>휴대폰 번호</label>
							<input type="text" name="reserverPhone" class="form-control" placeholder="예: 010-1234-5678">
							<div class="invalid-feedback">형식에 맞는 휴대폰 번호를 입력해주세요.</div>
						</div>
						<div class="form-group">
							<label>셍년월일</label>
							<input type="text" name="reserverPhone" class="form-control" placeholder="예: yyyyMMdd">
							<div class="invalid-feedback">형식에 맞는 생년월일을 입력해주세요.</div>
						</div>
						
					</form>
					<!-- 호텔 요청사항 쪽 끝-->
					<form>
						<div class="mt-5">
							<h5 class="mb-4">렌트 정보 안내</h5>
							<div class="d-flex border rounded p-3 mb-4" style="background-color: #fafafa;">
								<div class="w-50 text-center border-right">
									<div class="text-muted mb-1">대여일</div>
									<div style="font-weight: 500; color: #4564b8d2;">15:00 ~ 자정</div>
								</div>
								<div class="w-50 text-center">
									<div class="text-muted mb-1">반납일</div>
									<div style="font-weight: 500; color: #4564b8d2;">11:00 까지</div>
								</div>
							</div>
						</div>
					</form>
					<form>
						<h5 class="mb-4 mt-5">결제 정보</h5>
						<!-- 총 상품금액 -->
						<div class="d-flex justify-content-between mb-2" style="cursor: pointer;" onclick="toggleDetailAll()">
							<div class="text-muted">총 대여금액</div>
							<div class="d-flex align-items-center" style="gap: 4px;">
								<div style="font-weight: bold;" class="room-total-price" >ㅎㅎ</div>
								<img class="arrowImg" src="/resources/static/imgs/small-up.png" width="16" height="16" />
							</div>
						</div>
						<!-- 호텔 숙박 요금 -->
						<div class="priceDetail" style="display: none; font-size: 13px;">
							<div class="d-flex justify-content-between bg-light p-2 rounded mb-1">
								<div class="text-muted">1일 대여 요금</div>
								<div class="text-muted room-rm-price" >원</div>
							</div>
						</div>
						<hr>
						<!-- 총 결제금액 -->
						<div class="d-flex justify-content-between mt-3">
							<strong >총 결제금액</strong>
							<strong class="st-total-price">66,000원</strong>
						</div>
					</form>
				</div>
				<!-- 왼쪽 데이터 끝-->
				<div class="col-md-5" id="payment-summary-container" style="position: relative; overflow: visible;">
					<!-- Ajax로 불러온 내용이 여기에 들어옴 -->
				</div>
				
			</div>
			<div class="modal" id="paymentModal">
				<div class="modal-dialog modal-dialog-centered">
				<div class="modal-content">
					<!-- Modal 헤더 -->
					<div class="modal-header">
						<span>결제하기</span>
						<button type="button" class="close" data-dismiss="modal">&times;</button>
					</div>
					<!-- Modal 바디 -->
					<div class="modal-body" id="map1">
						<div class="payment-images">
							<img class="pay-type"  src="/resources/static/imgs/payment_kakao.png" alt="카카오페이" data-type="kakao">
							<img class="pay-type" src="/resources/static/imgs/payment_toss.png" alt="토스페이" data-type="toss">
						</div>
					</div>
				</div>
				</div>
			</div>  
		</div>
		
		<script>
			$(document).ready(function () {
				
				$(".priceDetail").hide();
				$(".arrowImg").attr("src", "/resources/static/imgs/small-down.png");
				let rm_name = $(".rm-name").text();
				
				$.ajax({
					url: '/rent/summary',
					// data : {rm_name : rm_name},
					type: 'GET',
					success: function (data) {
						
						$('#payment-summary-container').html(data);
						$(".priceDetail").slideDown(0);
						$(".arrowImg").attr("src", "/resources/static/imgs/small-up.png");
					},
					error: function (xhr) {
						console.error("요청 실패", xhr);
					}
				});
			});
		</script>
	</main>
</body>

</html>
