<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout.html}" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>숙소 등록</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
	<style>
		.main-container {
			max-width: 800px;
			margin: 40px auto;
			padding: 30px;
			background-color: #fdfdfd;
			border-radius: 16px;
			box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
			font-family: 'Segoe UI', sans-serif;
		}

		.title {
			font-size: 28px;
			font-weight: bold;
			color: #2c3e50;
			margin-bottom: 30px;
			text-align: center;
		}

		.form-section {
			margin-bottom: 30px;
		}

		.form-group {
			margin-bottom: 18px;
		}

		.form-label {
			display: block;
			font-weight: 600;
			color: #34495e;
			margin-bottom: 6px;
		}

		.form-input,
		.form-select {
			width: 100%;
			padding: 10px 12px;
			font-size: 15px;
			border: 1px solid #ccc;
			border-radius: 8px;
			box-sizing: border-box;
		}

		.form-file {
			margin-top: 8px;
		}

		.button {
			display: inline-block;
			background-color: #5dade2;
			color: white;
			padding: 10px 18px;
			font-size: 15px;
			border: none;
			border-radius: 8px;
			cursor: pointer;
			transition: background-color 0.3s ease;
			box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
		}

		.btn-submit {
			background-color: #03b80c;
		}

		.button:hover {
			background-color: #3498db;
		}

		.btn-submit:hover {
			background-color: #037c09;
		}

		.room-box {
			margin-bottom: 30px;
			padding: 20px;
			background-color: #f4f6f7;
			border: 1px dashed #bbb;
			border-radius: 12px;
		}

		.room-title {
			font-size: 18px;
			font-weight: bold;
			margin-bottom: 15px;
			color: #2e4053;
		}

		.image-grid {
			display: grid;
			grid-template-columns: repeat(4, 1fr);
			grid-template-rows: repeat(2, 150px);
			gap: 10px;
			max-width: 800px;
			margin: auto;
			padding: 20px;
		}

		.image-grid.room-grid {
			display: grid;
			grid-template-columns: repeat(2, 1fr);
			grid-template-rows: repeat(2, 150px);
			gap: 10px;
		}

		.image-grid.room-grid .image-main {
			grid-column: 1 / span 2;
			grid-row: 1;
			/* 1행만 차지 */
		}

		.image-box {
			position: relative;
			background-color: #e0e0e0;
			border-radius: 8px;
			overflow: hidden;
			cursor: pointer;
			display: flex;
			justify-content: center;
			align-items: center;
		}

		.image-box img {
			width: 100%;
			height: 100%;
			object-fit: contain;
			/* ✅ 이미지 전체를 박스에 맞춤 */
			object-position: center;
			/* ✅ 중앙 정렬 */
			background-color: #f0f0f0;
			/* ✅ 비어 있는 영역 배경색 (선택) */
		}

		.image-box input[type="file"] {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			opacity: 0;
			cursor: pointer;
			z-index: 2;
		}

		.plus-sign {
			font-size: 40px;
			color: #aaa;
			z-index: 1;
		}

		/* 메인 이미지 (2x2 병합) */
		.image-main {
			grid-column: 1 / span 2;
			grid-row: 1 / span 2;
		}

		.close-room-btn {
			position: absolute;
			top: 8px;
			right: 8px;
			background: transparent;
			border: none;
			font-size: 20px;
			cursor: pointer;
			color: #888;
		}
	</style>
</head>

<body style="background-color: #f5f6f7;">
	<div class="main" style="background-color: #fff;">
		<main layout:fragment="content">

			<form class="main-container" action="/owner/uploadLodgingPost" method="post" enctype="multipart/form-data">
				<div class="title">
					<i class="fas fa-hotel"> 신규 숙소 등록</i>
				</div>

				<div class="form-section" id="hotelForm">

					<div class="lodging-box form-group col-12">
						<label class="form-label" for="photos">숙소 사진 (5장)</label>
						<div class="image-grid">
							<!-- 이미지 박스 1번: 메인 (2x2) -->
							<div class="image-box image-main" data-index="1">
								<span class="plus-sign">+</span>
								<input type="file" accept="image/*" onchange="handleSingleImage($(this), 1, 'lodging')"
									name="lodgingThumbnailList" required>
							</div>

							<!-- 2~5번: 서브 이미지 -->
							<div class="image-box" data-index="2">
								<span class="plus-sign">+</span>
								<input type="file" accept="image/*" onchange="handleSingleImage($(this), 2, 'lodging')"
									name="lodgingThumbnailList" required>
							</div>
							<div class="image-box" data-index="3">
								<span class="plus-sign">+</span>
								<input type="file" accept="image/*" onchange="handleSingleImage($(this), 3, 'lodging')"
									name="lodgingThumbnailList" required>
							</div>
							<div class="image-box" data-index="4">
								<span class="plus-sign">+</span>
								<input type="file" accept="image/*" onchange="handleSingleImage($(this), 4, 'lodging')"
									name="lodgingThumbnailList" required>
							</div>
							<div class="image-box" data-index="5">
								<span class="plus-sign">+</span>
								<input type="file" accept="image/*" onchange="handleSingleImage($(this), 5, 'lodging')"
									name="lodgingThumbnailList" required>
							</div>
						</div>
					</div>

					<div class="d-flex">
						<div class="form-group col">
							<label class="form-label" for="ld_type">숙소 유형</label>
							<select class="form-select" id="ld_type" name="ld_type" required>
								<option value="">-- 선택 --</option>
								<option value="호텔">호텔</option>
								<option value="모텔">모텔</option>
								<option value="펜션">펜션</option>
							</select>
						</div>
						<div class="form-group col-3">
							<label class="form-label" for="ld_rating">성급 (1~5)</label>
							<select class="form-select" id="ld_rating" name="ld_rating" disabled>
								<option value="">-- 선택 --</option>
								<option value="1">1성</option>
								<option value="2">2성</option>
								<option value="3">3성</option>
								<option value="4">4성</option>
								<option value="5">5성</option>
							</select>
						</div>
						<div class="form-group col-3">
							<label class="form-label" for="ld_rg_num">지역</label>
							<select class="form-select" id="ld_rg_num" name="ld_rg_num" required>
								<option value="">-- 선택 --</option>
								<option th:each="region : ${regions}" th:value="${region.rg_num}"
									th:text="${region.rg_name}"></option>
							</select>
						</div>
					</div>
					<div class="form-group col-12">
						<label class="form-label" for="ld_name">숙소 이름</label>
						<input type="text" class="form-input" id="ld_name" name="ld_name" required>
					</div>

					<div class="form-group col-12">
						<label class="form-label mb-2">제공 옵션</label>

						<!-- 체크박스 컨테이너 -->
						<div class="d-flex flex-wrap gap-3">
							<!-- 기본 옵션들 -->
							<div th:each="opt : ${defaultOptions}" class="form-check d-flex align-items-center"
								style="width: 48%;">
								<input class="form-check-input me-2" type="checkbox" th:id="'option-' + ${opt}"
									th:name="options" th:value="${opt}" />
								<label class="form-check-label me-2" th:for="'option-' + ${opt}"
									th:text="${opt}"></label>

								<!-- "조식"일 때만 가격 입력 필드 출력 -->
								<input type="number" class="form-control form-control-sm ml-2 col-8"
									th:if="${opt == '조식'}" id="ld_meal_price" name="ld_meal_price"
									placeholder="조식 가격 (원)" disabled min="0" step="1000">
							</div>

							<!-- 기타 입력 항목 -->
							<div class="form-check d-flex align-items-center" style="width: 48%;">
								<input type="checkbox" class="form-check-input me-2" id="option-etc"
									onchange="toggleEtcInput(this)">
								<label class="form-check-label me-2" for="option-etc"
									style="min-width: 40px;">기타</label>
								<input type="text" id="etc-input" class="form-control form-control-sm"
									placeholder="옵션1, 옵션2, ..." disabled oninput="syncEtcToHidden()">
								<input type="hidden" name="added-options" id="etc-hidden" />
							</div>
						</div>
					</div>

					<div class="d-flex">
						<div class="form-group col-8">
							<label class="form-label" for="ld_region">주소</label>
							<input type="text" class="form-input" id="ld_region" name="ld_region" required>
						</div>

						<div class="form-group col-4">
							<label class="form-label" for="ld_number">전화번호</label>
							<input type="text" class="form-input" id="ld_number" name="ld_number" required>
						</div>
					</div>

					<div class="form-group col-12">
						<label class="form-label" for="ld_infor">상세 정보</label>
						<textarea class="form-input" name="ld_infor" id="ld_infor" style="height: 300px;"></textarea>
					</div>

					<div id="roomsContainer">
						<div class="room-box position-relative">
							<div class="room-title">
								<i class="fas fa-home"></i> 룸 <span class="room-numbering">1</span>
							</div>

							<div class="form-group">
								<label class="form-label">사진 (3장)</label>
								<div class="image-grid room-grid">
									<!-- index 1: 가로 2칸 이미지 -->
									<div class="image-box image-main" data-index="1">
										<span class="plus-sign">+</span>
										<input type="file" accept="image/*"
											onchange="handleSingleImage($(this), 1, 'room')"
											name="rooms[0].roomThumbnailList" required>
									</div>

									<!-- index 2 -->
									<div class="image-box" data-index="2">
										<span class="plus-sign">+</span>
										<input type="file" accept="image/*"
											onchange="handleSingleImage($(this), 2, 'room')"
											name="rooms[0].roomThumbnailList" required>
									</div>

									<!-- index 3 -->
									<div class="image-box" data-index="3">
										<span class="plus-sign">+</span>
										<input type="file" accept="image/*"
											onchange="handleSingleImage($(this), 3, 'room')"
											name="rooms[0].roomThumbnailList" required>
									</div>
								</div>

							</div>

							<div class="d-flex">
								<div class="form-group col-8">
									<label class="form-label">룸 이름</label>
									<input type="text" class="form-input" name="rooms[0].rm_name" required>
								</div>
								<div class="form-group col-4">
									<label class="form-label">룸 개수</label>
									<input type="number" class="form-input" name="rooms[0].rm_roomcount" min="1"
										required>
								</div>
							</div>
							<div class="d-flex">
								<div class="form-group col-3">
									<label class="form-label">최대 인원</label>
									<input type="number" class="form-input" name="rooms[0].rm_person" min="2" required>
								</div>

								<div class="form-group col-9">
									<label class="form-label">가격 (원)</label>
									<input type="number" class="form-input" name="rooms[0].rm_price" min="0" step="1000"
										required>
								</div>
							</div>

							<div class="form-group col-12">
								<label class="form-label">룸 정보</label>
								<textarea class="form-input" name="rooms[0].rm_infor" style="height: 100px;"></textarea>
							</div>
						</div>
					</div>

					<div class="d-flex justify-content-between">
						<button type="button" class="button" onclick="addRoomBox()">+ 룸 추가하기</button>
						<button type="submit" class="button btn-submit">호텔 등록</button>
					</div>
				</div>

			</form>

			<script>
				// 룸 추가 박스 열기
				function addRoomBox() {
					const roomBox = $(`
						<div class="room-box position-relative">
							<!-- ❌ 닫기 버튼 -->
							<button type="button" class="close-room-btn" title="삭제">×</button>

							<div class="room-title">
								<i class="fas fa-home"></i> 룸 <span class="room-numbering"></span>
							</div>

							<div class="form-group">
								<label class="form-label">사진 (3장)</label>
								<div class="image-grid room-grid">
									<!-- index 1: 가로 2칸 이미지 -->
									<div class="image-box image-main" data-index="1">
										<span class="plus-sign">+</span>
										<input type="file" accept="image/*" onchange="handleSingleImage($(this), 1, 'room')" class="room-thumb" required>
									</div>

									<!-- index 2 -->
									<div class="image-box" data-index="2">
										<span class="plus-sign">+</span>
										<input type="file" accept="image/*" onchange="handleSingleImage($(this), 2, 'room')" class="room-thumb" required>
									</div>

									<!-- index 3 -->
									<div class="image-box" data-index="3">
										<span class="plus-sign">+</span>
										<input type="file" accept="image/*" onchange="handleSingleImage($(this), 3, 'room')" class="room-thumb" required>
									</div>
								</div>

							</div>

							<div class="d-flex">
								<div class="form-group col-8">
									<label class="form-label">룸 이름</label>
									<input type="text" class="form-input room-name" required>
								</div>
								<div class="form-group col-4">
									<label class="form-label">룸 개수</label>
									<input type="number" class="form-input room-count" min="1" required>
								</div>
							</div>
							<div class="d-flex">
								<div class="form-group col-3">
									<label class="form-label">최대 인원</label>
									<input type="number" class="form-input room-person" min="2" required>
								</div>
	
								<div class="form-group col-9">
									<label class="form-label">가격 (원)</label>
									<input type="number" class="form-input room-price" min="0" step="1000" required>
								</div>
							</div>

							<div class="form-group col-12">
								<label class="form-label">룸 정보</label>
								<textarea class="form-input room-info" style="height: 100px;"></textarea>
							</div>
						</div>
					`);

					$('#roomsContainer').append(roomBox);
					resetNumber();
				}

				// 룸 추가 박스 닫기
				$(document).on('click', '.close-room-btn', function () {
					$(this).closest('.room-box').remove();
					resetNumber();
				});

				// 추가/삭제 시 넘버링
				function resetNumber() {
					$(".room-box").each(function (index) {
						$(this).find(".room-numbering").text(index + 1);
						$(this).find(".room-thumb").each(function () {
							$(this).attr("name", `rooms[${index}].roomThumbnailList`);
						});
						$(this).find(".room-name").attr("name", `rooms[${index}].rm_name`);
						$(this).find(".room-count").attr("name", `rooms[${index}].rm_roomcount`);
						$(this).find(".room-person").attr("name", `rooms[${index}].rm_person`);
						$(this).find(".room-price").attr("name", `rooms[${index}].rm_price`);
						$(this).find(".room-info").attr("name", `rooms[${index}].rm_infor`);
					})
				}

				// 단일 이미지 업로드 및 미리보기 처리
				function handleSingleImage($input, index, type) {
					const file = $input[0].files[0];
					if (!file) return;

					const reader = new FileReader();
					reader.onload = function (e) {
						const $box = $input.closest(`.image-box[data-index='${index}']`);

						// 이미 존재하는 이미지가 있으면 제거
						$box.find('img').remove();

						// 새 이미지 미리보기 추가 (input은 그대로 둠)
						const $img = $('<img>', {
							src: e.target.result,
							alt: 'image'
						});
						$box.append($img);

						// + 아이콘 숨기기
						$box.find('.plus-sign').hide();
					};
					reader.readAsDataURL(file);
				}

				// 이미지 박스를 클릭하면 파일 입력창 열기
				$(document).on('click', '.image-box', function (e) {
					const $input = $(this).find('input[type="file"]');
					if (e.target === $input[0]) return;
					$input.trigger('click');
				});

				$(document).ready(function () {
					// 1. 숙소 유형 변경 시 성급 select 활성화/비활성화
					$('#ld_type').on('change', function () {
						const selected = $(this).val();
						if (selected === '호텔') {
							$('#ld_rating').prop('disabled', false).prop('required', true);
						} else {
							$('#ld_rating').prop('disabled', true).val('');
						}
					});

					$('#ld_type').trigger('change'); // 폼 로드시 초기 상태 반영

					// 2. 기타 옵션 체크 시 입력 필드 활성화/비활성화
					$('#option-etc').on('change', function () {
						if ($(this).is(':checked')) {
							$('#etc-input').prop('disabled', false).prop('required', true);
						} else {
							$('#etc-input').val('').prop('disabled', true);
							$('#etc-hidden').val('');
						}
					});

					// 기타 옵션 입력값을 hidden 필드에 반영
					$('#etc-input').on('input', function () {
						$('#etc-hidden').val($(this).val());
					});

					// 1. 조식 체크박스 찾기 (value가 '조식'인 input)
					const $breakfastCheckbox = $("input[type='checkbox'][name='options'][value='조식']");

					// 2. 조식 체크 상태 변화 시 가격 입력 필드 토글
					$breakfastCheckbox.on('change', function () {
						if ($(this).is(':checked')) {
							$('#ld_meal_price').prop('disabled', false).prop('required', true);
						} else {
							$('#ld_meal_price').prop('disabled', true).val('');
						}
					});
				});
			</script>
		</main>
	</div>
</body>

</html>
