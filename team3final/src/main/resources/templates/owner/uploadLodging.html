<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout.html}" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>숙소 등록</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
	<style>
		.main-container {
			max-width: 800px;
			margin: 40px auto;
			padding: 30px;
			background-color: #fdfdfd;
			border-radius: 16px;
			box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
			font-family: 'Segoe UI', sans-serif;
		}

		.title {
			font-size: 28px;
			font-weight: bold;
			color: #2c3e50;
			margin-bottom: 30px;
			text-align: center;
		}

		.form-section {
			margin-bottom: 30px;
		}

		.form-group {
			margin-bottom: 18px;
		}

		.form-label {
			display: block;
			font-weight: 600;
			color: #34495e;
			margin-bottom: 6px;
		}

		.form-input,
		.form-select {
			width: 100%;
			padding: 10px 12px;
			font-size: 15px;
			border: 1px solid #ccc;
			border-radius: 8px;
			box-sizing: border-box;
		}

		.form-file {
			margin-top: 8px;
		}

		.button {
			display: inline-block;
			background-color: #5dade2;
			color: white;
			padding: 10px 18px;
			font-size: 15px;
			border: none;
			border-radius: 8px;
			cursor: pointer;
			transition: background-color 0.3s ease;
			box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
		}

		.button:hover {
			background-color: #3498db;
		}

		.room-box {
			margin-bottom: 30px;
			padding: 20px;
			background-color: #f4f6f7;
			border: 1px dashed #bbb;
			border-radius: 12px;
		}

		.room-title {
			font-size: 18px;
			font-weight: bold;
			margin-bottom: 15px;
			color: #2e4053;
		}

		.image-grid {
			display: grid;
			grid-template-columns: repeat(4, 1fr);
			grid-template-rows: repeat(2, 150px);
			gap: 10px;
			max-width: 800px;
			margin: auto;
			padding: 20px;
		}

		.image-grid.room-grid {
			display: grid;
			grid-template-columns: repeat(2, 1fr);
			grid-template-rows: repeat(2, 150px);
			gap: 10px;
		}

		.image-grid.room-grid .image-main {
			grid-column: 1 / span 2;
			grid-row: 1;
			/* 1행만 차지 */
		}

		.image-box {
			position: relative;
			background-color: #e0e0e0;
			border-radius: 8px;
			overflow: hidden;
			cursor: pointer;
			display: flex;
			justify-content: center;
			align-items: center;
		}

		.image-box img {
			width: 100%;
			height: 100%;
			object-fit: contain;
			/* ✅ 이미지 전체를 박스에 맞춤 */
			object-position: center;
			/* ✅ 중앙 정렬 */
			background-color: #f0f0f0;
			/* ✅ 비어 있는 영역 배경색 (선택) */
		}

		.image-box input[type="file"] {
			display: none;
		}

		.plus-sign {
			font-size: 40px;
			color: #aaa;
			z-index: 1;
		}

		/* 메인 이미지 (2x2 병합) */
		.image-main {
			grid-column: 1 / span 2;
			grid-row: 1 / span 2;
		}

		.close-room-btn {
			position: absolute;
			top: 8px;
			right: 8px;
			background: transparent;
			border: none;
			font-size: 20px;
			cursor: pointer;
			color: #888;
		}
	</style>
</head>

<body style="background-color: #f5f6f7;">
	<div class="main" style="background-color: #fff;">
		<main layout:fragment="content">

			<div class="main-container">
				<div class="title">🏨 숙소 등록</div>

				<div class="form-section" id="hotelForm">

					<div class="lodging-box form-group col-12">
						<label class="form-label" for="photos">숙소 사진 (5장)</label>
						<div class="image-grid">
							<!-- 이미지 박스 1번: 메인 (2x2) -->
							<div class="image-box image-main" data-index="1">
								<span class="plus-sign">+</span>
								<input type="file" accept="image/*" onchange="handleSingleImage($(this), 1, 'lodging')">
							</div>

							<!-- 2~5번: 서브 이미지 -->
							<div class="image-box" data-index="2">
								<span class="plus-sign">+</span>
								<input type="file" accept="image/*" onchange="handleSingleImage($(this), 2, 'lodging')">
							</div>
							<div class="image-box" data-index="3">
								<span class="plus-sign">+</span>
								<input type="file" accept="image/*" onchange="handleSingleImage($(this), 3, 'lodging')">
							</div>
							<div class="image-box" data-index="4">
								<span class="plus-sign">+</span>
								<input type="file" accept="image/*" onchange="handleSingleImage($(this), 4, 'lodging')">
							</div>
							<div class="image-box" data-index="5">
								<span class="plus-sign">+</span>
								<input type="file" accept="image/*" onchange="handleSingleImage($(this), 5, 'lodging')">
							</div>
						</div>
					</div>

					<div class="d-flex">
						<div class="form-group col-3">
							<label class="form-label" for="rating">성급 (1~5)</label>
							<select class="form-select" id="rating" name="rating">
								<option value="1">1성</option>
								<option value="2">2성</option>
								<option value="3">3성</option>
								<option value="4">4성</option>
								<option value="5">5성</option>
							</select>
						</div>

						<div class="form-group col-9">
							<label class="form-label" for="name">숙소 이름</label>
							<input type="text" class="form-input" id="name" name="name">
						</div>
					</div>

					<div class="form-group col-12">
						<label class="form-label" for="address">주소</label>
						<input type="text" class="form-input" id="address" name="address">
					</div>

					<div class="form-group col-12">
						<label class="form-label" for="phone">전화번호</label>
						<input type="text" class="form-input" id="phone" name="phone">
					</div>

					<div id="roomsContainer"></div>

					<button class="button" onclick="addRoomBox()">+ 방 등록하기</button>
				</div>

			</div>

			<script>
				let roomCount = 0;

				function addRoomBox() {
					roomCount++;
					const roomBox = $(`
						<div class="room-box position-relative">
							<!-- ❌ 닫기 버튼 -->
							<button type="button" class="close-room-btn" title="삭제">×</button>

							<div class="room-title">🛏️ 방 ${roomCount}</div>

							<div class="form-group">
								<label class="form-label">사진 (3장)</label>
								<div class="image-grid room-grid">
									<!-- index 1: 가로 2칸 이미지 -->
									<div class="image-box image-main" data-index="1">
										<span class="plus-sign">+</span>
										<input type="file" accept="image/*" onchange="handleSingleImage($(this), 1, 'room')">
									</div>

									<!-- index 2 -->
									<div class="image-box" data-index="2">
										<span class="plus-sign">+</span>
										<input type="file" accept="image/*" onchange="handleSingleImage($(this), 2, 'room')">
									</div>

									<!-- index 3 -->
									<div class="image-box" data-index="3">
										<span class="plus-sign">+</span>
										<input type="file" accept="image/*" onchange="handleSingleImage($(this), 3, 'room')">
									</div>
								</div>

							</div>

							<div class="form-group col-12">
								<label class="form-label">룸 유형</label>
								<input type="text" class="form-input" name="room_type_${roomCount}">
							</div>
							<div class="d-flex">
								<div class="form-group col-3">
									<label class="form-label">최대 인원</label>
									<input type="number" class="form-input" name="max_people_${roomCount}" min="1">
								</div>
	
								<div class="form-group col-9">
									<label class="form-label">가격 (원)</label>
									<input type="number" class="form-input" name="price_${roomCount}" min="0">
								</div>
							</div>
						</div>
					`);

					$('#roomsContainer').append(roomBox);
				}

				// 단일 이미지 업로드 및 미리보기 처리
				function handleSingleImage($input, index, type) {
					const file = $input[0].files[0];
					if (!file) return;

					const reader = new FileReader();
					reader.onload = function (e) {
						let $switchBox;
						if (type === 'lodging') {
							$switchBox = $input.closest('.lodging-box');
						} else if (type === 'room') {
							$switchBox = $input.closest('.room-box');
						}
						const $box = $switchBox.find(`.image-box[data-index='${index}']`);
						$box.html(`<img src="${e.target.result}" alt="image">`);
					};
					reader.readAsDataURL(file);
				}

				// 이미지 박스를 클릭하면 파일 입력창 열기
				$(document).on('click', '.image-box', function (e) {
					const $input = $(this).find('input[type="file"]');
					if (e.target === $input[0]) return;
					$input.trigger('click');
				});

				$(document).on('click', '.close-room-btn', function () {
					$(this).closest('.room-box').remove();
					roomCount--;
				});

			</script>
		</main>
	</div>
</body>

</html>
