<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout.html}" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>숙소 등록</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
	<!--스와이퍼-->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
	<style>
		.swiper {
			width: 100%;
			padding: 20px 10px;
		}

		.swiper-slide {
			width: 240px;
			height: 160px;
			border-radius: 10px;
			background-color: #e0e0e0;
			display: flex;
			justify-content: center;
			align-items: center;
			position: relative;
			cursor: pointer;
			overflow: hidden;
			box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
		}

		.swiper-slide img {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		.plus-sign {
			font-size: 48px;
			color: #aaa;
		}

		input[type="file"] {
			display: none;
		}

		.infor-title {
			font-size: 20px;
			color: #494949;
			line-height: 1.4;
			font-weight: 700;
		}

		.container {
			display: block;
			border-radius: 5px;
			padding: 0px;
			margin: auto;
			position: relative;
		}

		.infor-container {
			box-shadow: 0 4px 14px 0 rgba(0, 0, 0, 0.6);
			margin-top: 1rem;
		}
		
		.infor-item {
			padding: 2rem;
			background-color: #fff;
			border-radius: 5px;
		}

		.room-card {
			border-radius: 10px;
			background-color: #e0e0e0;
			display: flex;
			justify-content: center;
			align-items: center;
			position: relative;
			cursor: pointer;
			overflow: hidden;
			box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
		}

		/* ************************ */



		.hotel-box {
			padding: 1rem 2rem 1.5rem;
			display: flex;
			align-items: flex-start;
			gap: 1rem;
			background-color: #fff;
		}

		.hotel-img {
			flex: 1 1;
			width: 100%;
			max-width: 312px;
			display: flex;
			flex-direction: column;
			width: 100%;
		}

		.img-sub {
			display: flex;
			width: 100%;
			gap: .5rem;
			margin-top: .5rem;
		}

		.img-sub img {
			border-radius: .375rem;
			width: 0;
			flex: 1 1;
			aspect-ratio: 1.63 / 1;
			height: 100%;
			object-fit: cover;
			background-size: cover;
			background-repeat: no-repeat;
			background-position: center;
			display: block;
		}

		.hotel-price-list {
			margin-top: 0;
			margin-bottom: 2.5rem;
			flex: 1 1;
			display: flex;
			flex-direction: column;
			gap: .5rem;
		}

		.price-none {
			font-size: .875rem;
			padding: .125rem;
			border-radius: .25rem;
			align-items: center;
			display: flex;
			font-weight: 700;
			position: relative;
			color: #ff6362;
			background-color: #fff3f3;
			white-space: nowrap;
		}

		.hotel-content {
			font-size: .875rem;
			color: #666;
			line-height: 1.5;
		}
	</style>
</head>

<body style="background-color: #f5f6f7;">
	<div class="main" style="background-color: #fff;">
		<main layout:fragment="content">

			<div class="infor-container container">

				<!-- 숙소 정보 -->
				<div class="infor-item">
					<div class="infor-title mb-3">성급</div>

					<div class="infor-title mb-3">호텔이름</div>

					<div class="infor-title mb-3">숙소 사진 등록(5장)</div>
					<!-- 썸네일 5개(lodging) -->
					<div class="swiper container mb-3" style="padding: 0px 32px;">
						<div class="swiper-wrapper" id="thumb-container">
							<div class="swiper-slide" onclick="triggerFileInput(this)">
								<span class="plus-sign">+</span>
								<input type="file" accept="image/*" multiple onchange="handleFileChange(event, this)">
							</div>
						</div>
					</div>

					<!-- 호텔 정보 배너 -->
					<div class="infor-title mb-3">주소</div>
					<div class="infor-title mb-3">전화번호</div>
				</div>

				<!-- 룸 정보 -->
				<div class="infor-item">
					<div class="infor-title mb-3">룸 유형</div>
					<div class="infor-title mb-3">최대 인원</div>
					<div class="infor-title mb-3">가격</div>
					<div class="infor-title mb-3">룸 사진 등록(3장)</div>

					<div class="hotel-box">

						<!-- 세부 썸네일 3개, 정보 -->
						<div class="hotel-img">

							<!-- 메인 이미지 (첫 번째 이미지) -->
							<div class="img1"
								style="position: relative; cursor: pointer; width: 100%; aspect-ratio: 1.63 / 1; height: fit-content;">
								<img src="/resources/static/img/ho1.jpg" alt="대표 이미지"
									style="border-radius: .375rem; width: 100%; height: 100%; position: relative;">
							</div>
							<!-- 서브 이미지 (두 번째, 세 번째 이미지) -->
							<div class="img-sub">
								<img src="/resources/static/img/ho1.jpg" alt="서브 이미지">
								<img src="/resources/static/img/ho1.jpg" alt="서브 이미지">
							</div>
						</div>
					</div>
				</div>
			</div>

			<script>
				const max_lodgingImages = 5;

				// Swiper 초기화
				const swiper = new Swiper('.swiper', {
					slidesPerView: 'auto', // 자동 너비로 슬라이드 생성
					spaceBetween: 16,      // 슬라이드 간 간격
					freeMode: true,        // 자연스러운 스크롤
					grabCursor: true       // 마우스 커서 변경
				});

				// 파일 업로드 카드 클릭시 실행
				function triggerFileInput(box) {
					const $input = $(box).find('input[type="file"]')[0];
					if (!$input) return;

					// 만약 input이 클릭되어 호출된 거라면 무시
					if (event?.target === $input) return;

					$input.click();
				}

				// 파일 업로드 시 미리보기 넣기
				function handleFileChange(event, input) {
					const $container = $('#thumb-container');
					const files = Array.from(event.target.files);
					const existingImages = $container.find('img').length;
					const filesToAdd = files.slice(0, max_lodgingImages - existingImages);
					const $plusBox = $(input).closest('.swiper-slide');

					filesToAdd.forEach((file, index) => {
						const reader = new FileReader();
						reader.onload = function (e) {
							if (index === 0 && $plusBox.find('img').length === 0) {
								// 첫 번째 이미지는 기존 박스에 넣음
								$plusBox.html(`<img src="${e.target.result}">`);
							} else {
								// 나머지는 새 박스 생성
								const $newBox = $('<div class="swiper-slide"></div>');
								$newBox.html(`<img src="${e.target.result}">`);
								$container.append($newBox);
								swiper.appendSlide($newBox[0]); // DOM element로 넘겨야 함
							}
						};
						reader.readAsDataURL(file);
					});

					// 이미지 추가 후 +박스 추가 여부 판단
					setTimeout(() => {
						const totalImages = $container.find('img').length;
						const $existingPlus = $container.find('.plus-sign').closest('.swiper-slide');

						if (totalImages < max_lodgingImages) {
							if ($existingPlus.length === 0) {
								const $newAddBox = $('<div class="swiper-slide"></div>');
								$newAddBox.on('click', function () {
									triggerFileInput(this);
								});
								$newAddBox.html(`
									<span class="plus-sign">+</span>
									<input type="file" accept="image/*" multiple onchange="handleFileChange(event, this)">
								`);
								$container.append($newAddBox);
								swiper.appendSlide($newAddBox[0]);
							} else {
								swiper.update();
							}
						} else {
							if ($existingPlus.length > 0) {
								swiper.removeSlide(swiper.slides.length - 1);
								$existingPlus.remove();
							}
						}

						swiper.update();
					}, 100);
				}
			</script>
		</main>
	</div>
</body>

</html>
