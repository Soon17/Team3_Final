<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout.html}" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<title>결제</title>
	
	<style>
		.payment-images {
			display: flex;
			justify-content: center;
			align-items: center;
			gap: 30px; /* 이미지 사이 간격 */
			flex-wrap: wrap; /* 화면 작을 때 줄바꿈 */
		}

		.payment-images img {
			max-width: 150px; /* 이미지 최대 너비 제한 */
			height: auto;
			transition: transform 0.3s ease;
			cursor: pointer;
		}

		.payment-images img:hover {
			transform: scale(1.05); /* 마우스 올렸을 때 약간 확대 */
		}
		.toss-pay {
			border-radius: 30px;
			background-color: #e6f0ff; /* 토스 느낌의 연한 파랑 배경 */
		}
		.main-container {
			background-color: #f5f6f7;
			font-family: 'Noto Sans KR', sans-serif;
		}

		.container-box {
			background-color: #fff;
			padding: 30px;
			border-radius: 10px;
			box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
			width: 100%;
			max-width: 100%;
		}

		h5 {
			font-size: 20px !important;
			font-weight: bold;
		}

		.row {
			max-width: 1032px;
			display: flex;
			justify-content: center;
			flex-wrap: nowrap;
			margin-top: 30px;
			margin-bottom: 150px;
		}

		.in {
			margin-top: 50px;
			margin-bottom: 10px;
		}

		.option-label {
			color: #333;
			font-size: 15px;
			font-weight: 400;
			margin-left: 6px;
			cursor: pointer;
			user-select: none;
		}

		.form-check {
			display: flex;
			align-items: center;
		}

		.form-check-input {
			width: 16px;
			height: 16px;
			margin-top: 0;
			margin-right: 0;
			transform: translateY(-4px);
			/*체크박스 위치조절*/
			cursor: pointer;
		}

		.form-check-input:checked+.option-label {
			color: #007BFF;
			font-weight: 500;
		}

		@media screen and (max-width:990px) {
			footer {
				display: none;
			}

			.row {
				flex-direction: column;
				align-items: center;
				padding: 0;
				margin: 0 auto;
			}

			.container-box {
				padding: 20px;
				margin-right: 0 !important;
				margin-bottom: 70px;
				margin-top: 10px;
				width: 100%;
				max-width: 640px;
			}

		}
	</style>
</head>

				<!-- 왼쪽 데이터 끝-->

						<span>결제하기</span>
						<button type="button" class="close" data-dismiss="modal">&times;</button>
					</div>
					<!-- Modal 바디 -->
					<div class="modal-body" id="map1">
						<div class="payment-images">
							<img class="kakao-pay" src="/resources/static/imgs/payment_kakao.png" alt="카카오페이">
							<img class="toss-pay" src="/resources/static/imgs/payment_toss.png" alt="토스페이">

					</div>
				</div>
				</div>

		</div>
		
		<script>
			let total;
			$(document).ready(function () {
				// 날짜 텍스트 가져오기
				const checkInText = $('.check-in').text().trim();   // 예: "5/23/금"
				const checkOutText = $('.check-out').text().trim(); // 예: "5/24/토"

				// 날짜 포맷에서 숫자만 추출
				const parseDate = (text) => {
					const parts = text.split('/'); // ["5", "23", "금"]
					const month = parseInt(parts[0]);
					const day = parseInt(parts[1]);
					const year = new Date().getFullYear(); // 연도는 현재 연도로 가정
					return new Date(year, month - 1, day); // JavaScript는 월이 0부터 시작
				};

				const checkInDate = parseDate(checkInText);
				const checkOutDate = parseDate(checkOutText);

				// 날짜 차이 계산
				const diffTime = checkOutDate - checkInDate;
				const diffDays = diffTime / (1000 * 60 * 60 * 24); // ms → days
				// .badge 안에 텍스트로 n박 입력
				$('.night').text(`${diffDays}박`);
				total = $(".room-total-price").text()* diffDays;
				$(".room-total-price").text(total.toLocaleString()+"원");
				$(".st-total-price").text(total.toLocaleString()+"원");
			});



			let detailVisible = true;
			let isSyncing = false;

			function toggleDetailAll() {
				const $details = $(".priceDetail");
				const $arrows = $(".arrowImg");

				detailVisible = !detailVisible;

				if (detailVisible) {
					$details.stop(true, true).slideDown(200);
					$arrows.attr("src", "/resources/static/imgs/small-up.png");
				} else {
					$details.stop(true, true).slideUp(200);
					$arrows.attr("src", "/resources/static/imgs/small-down.png");
				}
			};

			function copyReserverToGuest() {
				isSyncing = true;
				const name = $("input[name='reserverName']").val();
				const phone = $("input[name='reserverPhone']").val();
				$("input[name='guestName']").val(name).trigger("input");
				$("input[name='guestPhone']").val(phone).trigger("input");
				isSyncing = false;
			}

			$(document).ready(function () {
				$(".priceDetail").hide();
				$(".arrowImg").attr("src", "/resources/static/imgs/small-down.png");
				let rm_name = $(".rm-name").text();
				$.ajax({
					url: '/pay/summary',
					data : {rm_name : rm_name},
					type: 'GET',
					success: function (data) {
						$('#payment-summary-container').html(data);
						$(".priceDetail").slideDown(0);
						$(".arrowImg").attr("src", "/resources/static/imgs/small-up.png");
					},
					error: function (xhr) {
						console.error("요청 실패", xhr);
					}
				});

				// 기본값 복사 (초기 로딩 시)
				if ($("#sameInfo").is(":checked")) {
					copyReserverToGuest();
				}

				let prevChecked = $("#sameInfo").is(":checked");

				$("#sameInfo").on("click", function () {
					const isCheckedNow = $(this).is(":checked");

					if (!isCheckedNow && prevChecked) {
						// 직접 클릭으로 해제한 경우만 초기화
						$("input[name='guestName']").val("");
						$("input[name='guestPhone']").val("");
					}

					prevChecked = isCheckedNow;

					if (isCheckedNow) {
						copyReserverToGuest();
					}
				});

				// 예약자 입력 변경 시 → 동기화
				$("input[name='reserverName'], input[name='reserverPhone']").on("input", function () {
					if ($("#sameInfo").is(":checked")) {
						copyReserverToGuest();
					}
				});

				// 숙박자 직접 입력 시 → 체크 해제
				$("input[name='guestName'], input[name='guestPhone']").on("input", function () {
					if (isSyncing) return;
					if ($("#sameInfo").is(":checked")) {
						guestModified = true;
						$("#sameInfo").prop("checked", false).trigger("change");
					}
				});

				// 예약자 이름
				$("[name='reserverName']").on("input", function () {
					const nameRegex = /^[가-힣a-zA-Z]{2,20}$/;
					if (!nameRegex.test($(this).val().trim())) {
						$(this).addClass("is-invalid");
					} else {
						$(this).removeClass("is-invalid");
					}
				});

				// 숙박자 이름 (체크박스 체크 시 스킵)
				$("[name='guestName']").on("input", function () {
					const nameRegex = /^[가-힣a-zA-Z]{2,20}$/;
					if ($("#sameInfo").is(":checked")) {
						$(this).removeClass("is-invalid");
						return;
					}
					if (!nameRegex.test($(this).val().trim())) {
						$(this).addClass("is-invalid");
					} else {
						$(this).removeClass("is-invalid");
					}
				});

				// 예약자 전화번호
				$("input[name='reserverPhone']").on("input", function () {
					const phoneRegex = /^01[016789]-\d{3,4}-\d{4}$/;
					if (!phoneRegex.test($(this).val().trim())) {
						$(this).addClass("is-invalid");
					} else {
						$(this).removeClass("is-invalid");
					}
				});

				// 숙박자 전화번호
				$("input[name='guestPhone']").on("input", function () {
					const phoneRegex = /^01[016789]-\d{3,4}-\d{4}$/;
					if ($("#sameInfo").is(":checked")) {
						$(this).removeClass("is-invalid");
						return;
					}
					if (!phoneRegex.test($(this).val().trim())) {
						$(this).addClass("is-invalid");
					} else {
						$(this).removeClass("is-invalid");
					}
				});
			});
		</script>
		<script>
			let loMeal;
			$('.choice-check').on('change', function () {
				if ($(this).is(':checked')) {
					if($(this).data('co-do-name')==="조식"){
						$.ajax({
							async : true,
							url : '/meal/price', 
							type : 'post', 
							success : function (data){
								loMeal = data.mealPrice
								total += loMeal;
								$('.room-total-price, .st-total-price, .summary-total-price, .summary-st-price, .mobile-room-price').text(total.toLocaleString()+"원");
							}
						});												
					}
				} else {
					total -= loMeal;
					$('.room-total-price, .st-total-price, .summary-total-price, .summary-st-price, .mobile-room-price').text(total.toLocaleString()+"원");					
				}
			});
			function toggleDetailAll() {
			const $details = $(".priceDetail");
			const $arrows = $(".arrowImg");

			detailVisible = !detailVisible;

			if (detailVisible) {
				$details.slideDown(200);
				$arrows.attr("src", "/resources/static/imgs/small-up.png");
			} else {
				$details.slideUp(200);
				$arrows.attr("src", "/resources/static/imgs/small-down.png");
			}
			}

			$(document).ready(function () {
			$(".priceDetail").slideDown(0);
			$(".arrowImg").attr("src", "/resources/static/imgs/small-up.png");

			// 모바일 하단 금액 텍스트 자동 반영
			const total = $(".pay-summary-box strong").last().text();
			$(".mobile-pay-footer strong").text(`${total} 바로 결제하기`);

			$(document).on("click", ".btn.btn-primary, .mobile-pay-button", function (e) {
				let shouldOpenModal = false;
				
				const nameRegex = /^[가-힣a-zA-Z]{2,20}$/;
				const phoneRegex = /^01[016789]-\d{3,4}-\d{4}$/;

				const reserverName = $("input[name='reserverName']");
				const reserverPhone = $("input[name='reserverPhone']");
				const guestName = $("input[name='guestName']");
				const guestPhone = $("input[name='guestPhone']");
				const sameInfo = $("#sameInfo").is(":checked");

				// 예약자 이름
				if (!nameRegex.test(reserverName.val().trim())) {
				alert("[예약자 정보 > 이름] 이름을 정확하게 입력해 주세요.");
				reserverName.addClass("is-invalid").focus();
				e.preventDefault();
				return;
				} else {
				reserverName.removeClass("is-invalid");
				}

				// 예약자 번호
				if (!phoneRegex.test(reserverPhone.val().trim())) {
				alert("[예약자 정보 > 휴대폰 번호] 휴대폰 번호를 입력해 주세요.");
				reserverPhone.addClass("is-invalid").focus();
				e.preventDefault();
				return;
				} else {
				reserverPhone.removeClass("is-invalid");
				}

				if (!sameInfo) {
				// 숙박자 이름
					if (!nameRegex.test(guestName.val().trim())) {
						alert("[숙박자 정보 > 이름] 이름을 정확하게 입력해 주세요.");
						guestName.addClass("is-invalid").focus();
						e.preventDefault();
						return;
					} else {
						guestName.removeClass("is-invalid");
					}

					// 숙박자 번호
					if (!phoneRegex.test(guestPhone.val().trim())) {
						alert("[숙박자 정보 > 휴대폰 번호] 휴대폰 번호를 입력해 주세요.");
						guestPhone.addClass("is-invalid").focus();
						e.preventDefault();
						return;
					} else {
						guestPhone.removeClass("is-invalid");
					}         
				}
				shouldOpenModal = true;
				if (shouldOpenModal) {
					$('#paymentModal').modal('show');
				}								
			});
			$(document).on("click", ".kakao-pay", function (e) {
				//카카오결제
				$.ajax({
				async : true,
				url : '/pay/kakao/apiKey', 
				type : 'post', 
				success : function (data){
					let channelKey = data.channel
					let storeId= data.store
					requestPayment(channelKey,storeId)
				}
				});			
				async function requestPayment(channelKey,storeId) {
					// const tPriceText = $(".summary-total-price").text(); // "100,000원" 찐 코드
					// const totlaPrice = parseInt(tPriceText.replace(/[^0-9]/g, ''));
					const totlaPrice = $(".summary-total-price").data('total');//테스트 코드 10원
					const rm_name = $(".rm-name").text();
					const reserverName = $("[name = 'reserverName']").val();
					const guestName = $("[name = 'guestName']").val();
					const guestPhone = $("[name = 'guestPhone']").val();
					let choice_option_nums = [];
					let mealState = "N";
					let lrText = $('.lr-rm-person').text(); // 예: "성인 2명"
					let lr_count = lrText.match(/\d+/)[0];
					$('.choice-check:checked').each(function () {
						choice_option_nums.push($(this).val());
						if($(this).data('co-do-name')===("조식")){
							mealState="Y";
						}
					});
					const response = await PortOne.requestPayment({
					// Store ID 설정
					storeId: storeId,
					// 채널 키 설정
					channelKey: channelKey,
					paymentId: `payment-${crypto.randomUUID()}`,
					orderName: rm_name,
					totalAmount: totlaPrice,
					currency: "CURRENCY_KRW",
					payMethod: 'EASY_PAY',
					});
					if (response.code !== undefined) {
					// 오류 발생
					return alert(response.message);
					}
					// /payment/complete 엔드포인트를 구현해야 합니다. 다음 목차에서 설명합니다.
					const notified = await fetch(`http://localhost:8080/pay/kakao/complete`, {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					// paymentId와 주문 정보를 서버에 전달합니다
					body: JSON.stringify({
						lr_total_price:totlaPrice,
						lr_booker_name:reserverName,
						lr_guest_name:guestName,
						lr_guest_number:guestPhone,
						lr_meal_state:mealState,
						choice_option_nums:choice_option_nums,
						lr_count:lr_count
					}),
					});
					if (notified.ok) {
						// 예: 결제 완료 화면으로 이동
						alert("결제 성공!");
						window.location.href = "/member/mypage";
					} else {
						alert("결제 처리 실패!");
					}
				}   
			})
			});
			//카카오페이
		</script>
	</main>
</body>
