<!DOCTYPE html>
<html
	lang="en" 
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<title>예약내역</title>
	<style>
		.container {
    margin: 0 auto;
		}

		.table {
				width: 100%;
				margin: 10px auto;
		}

		.text-center {
				text-align: center;
		}
	</style>
</head>
<body>
	<main layout:fragment="content">
		<div class="container" th:if="${!#lists.isEmpty(reservations)}">
			<h3 class="text-center">최근 호텔 예약 내역</h3>
			<table class="table table-striped text-center">
				<thead>
					<tr>
						<th>예약번호</th>
						<th>예약자</th>
						<th>숙소이름</th>
						<th>객실이름</th>
						<th>체크인</th>
						<th>체크아웃</th>
						<th>예약일자</th>
						<th>상태</th>
						<th>예약취소</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="res : ${reservations}">
						<td th:text="${res.lr_num}"></td>
						<td th:text="${res.lr_booker_name}"></td>
						<td th:text="${res.lr_ld_name}"></td>
						<td th:text="${res.lr_rm_name}"></td>
						<td th:text="${#dates.format(res.lr_checkin, 'yyyy-MM-dd')}"></td>
						<td th:text="${#dates.format(res.lr_checkout, 'yyyy-MM-dd')}"></td>
						<td th:text="${#dates.format(res.lr_date, 'yyyy-MM-dd HH:mm')}"></td>
						<td th:text="${res.lr_state}"></td>
						<td>
							<button
								th:if="${res.cancelable}"
								th:attr="data-lr_num=${res.lr_num}"
								class="btn btn-danger cancel-btn">
								예약 취소
							</button>
							<span th:unless="${res.cancelable}" style="color: gray;">
								취소 불가
							</span>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
		<!-- 예약 내역이 없을 때 -->
		<div th:if="${#lists.isEmpty(reservations)}" class="empty-box">
			<p class="main-text">예약하신 호텔 내역이 없습니다 :)</p>
			<p class="sub-text">지금 호텔 예약하고<br>신나는 여행 떠나볼까요?</p>
			<a class="primary-btn" href="/">호텔 보러가기</a>
		</div>
		<script>
		$(document).ready(function() {
			$(".cancel-btn").click(function() {
				if (!confirm("정말 이 호텔 예약을 취소하시겠습니까?")) return;

				const lrNum = $(this).data("lr_num");

				$.ajax({
					url: "/member/reservation-hotel/cancel",
					method: "POST",
					data: { lr_num: lrNum },
					success: function(response) {
						if (response === "success") {
							alert("예약이 성공적으로 취소되었습니다.");
							location.reload();
						} else {
							alert("예약 취소에 실패했습니다.");
						}
					},
					error: function() {
						alert("서버와의 통신에 실패했습니다.");
					}
				});
			});
		});
	</script>
	</main>
</body>
</html>
