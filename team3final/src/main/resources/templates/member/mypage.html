<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layout/layout.html}">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<head>
	<meta charset="UTF-8">
	<title>마이페이지</title>
	<style>
		.mypage {
			font-family: sans-serif;
			padding: 40px 20px;
			max-width: 80%;
			margin: auto;
			color: #333;
		}

		.user-info .username {
			font-size: 18px;
			font-weight: bold;
		}

		.user-info .email {
			display: block;
			font-size: 13px;
			color: #777;
		}

		.family-btn {
			font-size: 12px;
			background: #f1f1f1;
			border: none;
			border-radius: 12px;
			padding: 4px 10px;
			cursor: pointer;
		}

		/* 요약 카드 */
		.summary {
			display: flex;
			justify-content: space-between;
			margin: 20px 0;
		}

		.summary-item {
			flex: 1;
			background: #fafafa;
			text-align: center;
			padding: 10px;
			margin: 0 5px;
			border-radius: 8px;
			font-size: 14px;
			color: gray;
			cursor: pointer;
		}

		.summary-item:hover {
			text-decoration: none;
			color: inherit;
		}

		.summary-item i {
			font-size: 20px;
			color: #aaa;
			margin-bottom: 4px;
		}

		/* 패밀리 라운지 링크 */
		.family-link {
			text-align: right;
			font-size: 13px;
			margin-bottom: 15px;
		}

		/* 탭 메뉴 */
		.tabs {
			display: flex;
			justify-content: space-around;
			border-bottom: 1px solid #eee;
			margin-bottom: 20px;
		}

		.tab {
			padding: 10px;
			font-size: 14px;
			color: #aaa;
			cursor: pointer;
		}

		.tab.active {
			color: #007bff;
			border-bottom: 2px solid #007bff;
			font-weight: bold;
		}

		/* 렌트 없음 박스 */
		.empty-box {
			text-align: center;
			color: #444;
		}

		.empty-box img {
			width: 100px;
			margin-bottom: 20px;
		}

		.main-text {
			font-size: 16px;
			font-weight: bold;
		}

		.sub-text {
			font-size: 14px;
			color: #777;
			margin: 10px 0 20px;
		}

		.primary-btn {
			border: 1px solid #007bff;
			background: none;
			color: #007bff;
			padding: 10px 20px;
			border-radius: 10px;
			cursor: pointer;
		}

		.primary-btn:hover {
			text-decoration: none;
		}

		.link-btn {
			display: block;
			margin-top: 15px;
			font-size: 13px;
			color: #666;
			text-decoration: underline;
		}

		.btn-modify {
			border-color: gray;
			font-size: 12px;
		}

		/* 기본 헤더 스타일 */
		.user-header {
			display: flex;
			justify-content: space-between;
			align-items: flex-start;
			margin-bottom: 10px;
			min-height: 50px;
		}

		/* 호텔 예약 내역이 로드될 때도 높이를 유지 */
		.summary-item,
		.summary-item.active {
			height: auto;
			min-height: 50px;
		}

		.text-center {
			word-break: keep-all;
			vertical-align: middle;
			line-height: 1.3;
		}
	</style>
</head>

<body>
	<main layout:fragment="content">
		<div class="mypage bg-light">
			<!-- 사용자 정보 -->
			<div class="user-header d-flex align-items-center" th:if="${logIn}">
				<div class="user-info">
					<strong class="username" th:text="${user.me_nick}"></strong>
					<span class="email" th:text="${user.me_email}"></span>
				</div>
				<div>
					<a class="btn btn-modify" href="/member/modify">내 정보 관리</a>
					<a class="btn btn-modify d-block d-md-none" href="/logout">로그아웃</a>
				</div>
			</div>
			<div class="user-header" th:if="${!logIn}">
				<a class="btn btn-modify col-12" href="/member/signIn">로그인 후 이용하세요</a>
			</div>

			<div sec:authorize="hasRole('USER')">
				<!-- 요약 영역 -->
				<div class="summary">
					<a class="summary-item" href="/member/reservation-history">
						<i class="fa fa-calendar"></i>
						<p>예약내역</p>
					</a>
					<a class="summary-item" href="/member/view-review">
						<i class="fa fa-pen"></i>
						<p>나의리뷰</p>
					</a>
				</div>

				<!-- 탭 메뉴 -->
				<div class="tabs">
					<div class="tab active" id="reservation-hotel">호텔</div>
					<div class="tab" id="reservation-rent">렌트카</div>
				</div>

				<!-- 기본은 호텔 내역 -->
				<div class="empty-box">
					<p class="main-text">예약하신 호텔 내역이 없습니다 :)</p>
					<p class="sub-text">지금 호텔 예약하고<br>신나는 여행 떠나볼까요?</p>
					<a class="primary-btn" href="/">호텔 보러가기</a>
				</div>
			</div>

			<div sec:authorize="hasRole('OWNER')">
				<!-- 요약 영역 -->
				<div class="summary">
					<a class="summary-item" href="/owner/uploadLodging">
						<i class="fa fa-hotel"></i>
						<p>숙소 등록</p>
					</a>
					<a class="summary-item" href="/owner/uploadRental">
						<i class="fa fa-car"></i>
						<p>렌트 등록</p>
					</a>
				</div>
			</div>
		</div>
		<script>
			// 페이지 로드 시 호텔 예약 내역 자동 로드
			$(document).ready(function () {
				
				loadHotelReservation();

				// 탭 클릭 이벤트 바인딩
				$('#reservation-hotel').on('click', function () {
					$(this).addClass('active');
					$('#reservation-rent').removeClass('active');
					loadHotelReservation();
				});

				$('#reservation-rent').on('click', function () {
					$(this).addClass('active');
					$('#reservation-hotel').removeClass('active');
					loadRentReservation();
				});

				// 호텔 예약 내역을 불러오는 함수
				function loadHotelReservation() {

					$.ajax({
						url: '/member/reservation-hotel',
						method: 'GET',
						success: function (data) {
							$('.empty-box').html(data);
						},
						error: function () {
							$('.empty-box').html('<p>호텔 예약 내역을 불러오는 데 실패했습니다.</p>');
						}
					});
				}

				function loadRentReservation() {
					$.ajax({
						url: '/member/reservation-rent',
						method: 'GET',
						success: function (data) {
							$('.empty-box').html(data);
						},
						error: function () {
							$('.empty-box').html('<p>렌트카 예약 내역을 불러오는 데 실패했습니다.</p>');
						}
					});
				}
			});
		</script>
		<script>
			$(document).ready(function () {

				$(document).on("click", ".rent-cancel-btn", function(e){
					
					console.log("버튼 눌림 확인 ");
					if (!confirm("정말 해당 렌트 예약을 취소하시겠습니까?")) return;
					
					const rrNum = $(this).data("rr_num");
					
					$.ajax({
						url: "/member/reservation-rent/cancel",
						method: "POST",
						data: { rr_num: rrNum },
						success: function (response) {
							if (response === "success") {
								alert("예약이 성공적으로 취소되었습니다.");
								location.reload();
							} else {
								alert("예약 취소에 실패했습니다.");
							}
                    },
                    error: function () {
											alert("서버와의 통신에 실패했습니다.");
                    }
									});
								})
							});
			</script>
		</main>
	</body>
								
</html>
