<!DOCTYPE html>
<html
	lang="en" 
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
	layout:decorate="~{layout/layout.html}">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>예약내역</title>
	<style>
		.tab {
			width: 50%;
			text-align: center;
			padding: 10px 20px;
			color: #888;
			cursor: pointer;
		}
		.tab.active {
			color: #007bff;
			border-bottom: 2px solid #007bff;
		}
		.state-select{
			border: 1px solid #ced4da;
			border-radius: .5rem;
			padding: .5rem 1.5rem .5rem .75rem;
			appearance: none;
			-webkit-appearance: none;
			background: #fff url(data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTMiIGhlaWdodD0iMTIiIHZpZXdCb3g9IjAgMCAxMyAxMiIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KICAgIDxwYXRoIGQ9Im05LjUgNC0zIDMtMy0zIiBzdHJva2U9IiM5OTkiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIvPgo8L3N2Zz4K) no-repeat center right .5rem;
		}
		#modalOverlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.5);
    z-index: 9999;
		}

		#reviewModal {
			display: none;
			background: #fff;
			width: 600px;
			margin: 100px auto;
			padding: 30px;
			border-radius: 12px;
			box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
			position: relative;
			z-index: 10000;
		}

		#reviewModal textarea {
			resize: none;
			width: 100%;
			height: 100px;
			padding: 10px;
			font-size: 14px;
			border: 1px solid #ccc;
			border-radius: 6px;
		}

		#reviewModal button {
			padding: 8px 16px;
			border: none;
			border-radius: 5px;
			cursor: pointer;
		}

		#reviewModal button:first-of-type {
			background-color: #4CAF50;
			color: white;
			margin-right: 10px;
		}

		#reviewModal button:last-of-type {
			background-color: #ccc;
			color: black;
		}
		.star-rating {
			font-size: 2rem;
			direction: ltr;
			unicode-bidi: bidi-override;
			user-select: none;
			display: inline-block;
		}

		.star-rating .star {
			color: #ccc;
			cursor: pointer;
			transition: color 0.2s;
		}

		.star-rating .star.hover,
		.star-rating .star.selected {
			color: gold;
		}
		#modalOverlayRental {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.5);
    z-index: 9999;
		}

		#reviewModalRental {
			display: none;
			background: #fff;
			width: 600px;
			margin: 100px auto;
			padding: 30px;
			border-radius: 12px;
			box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
			position: relative;
			z-index: 10000;
		}

		#reviewModalRental textarea {
			resize: none;
			width: 100%;
			height: 100px;
			padding: 10px;
			font-size: 14px;
			border: 1px solid #ccc;
			border-radius: 6px;
		}

		#reviewModalRental button {
			padding: 8px 16px;
			border: none;
			border-radius: 5px;
			cursor: pointer;
		}

		#reviewModalRental button:first-of-type {
			background-color: #4CAF50;
			color: white;
			margin-right: 10px;
		}

		#reviewModalRental button:last-of-type {
			background-color: #ccc;
			color: black;
		}
		#reservation-table tr{
			line-height: 40px;
		}
		#reservation-table tr td:last-child *{
			width: 100%;
		}
		#rentcar-reservations tr{
			line-height: 40px;
		}
		#rentcar-reservations tr td:last-child *{
			width: 100%;
		}
	</style>
</head>
<body>
	<main layout:fragment="content">
		<div style="width: 100%; border-top: 1px solid #eeeeee;"></div>
		<div class="main-text" style="text-align: center; padding: 2rem 0;">
			<h1 class="js-hero-pc-title" style="font-size: 24px; color: #333;">예약내역</h1>
		</div>
		<div style="width: 70%; margin: 20px auto; background-color: #fff; padding: 30px; border-radius: 8px; width: 768px;">
			<div id="tab-menu" style="display: flex; justify-content: center; margin-top: 20px; border-bottom: 2px solid #ddd;">
				<div class="tab" onclick="changeTab(this)">렌트카</div>
				<div class="tab active" onclick="changeTab(this)">호텔</div>
			</div>
			<select id="reservation-state" class="state-select" style="margin-top: 1rem; width: 100%; padding: .75rem; color: #494949; font-size: .875rem;" onchange="filterReservations()">
				<option value="전체">전체</option>
				<option value="예약완료">예약완료</option>
				<option value="취소/환불">취소/환불</option>
			</select>
		</div>
		<div>
			<div style="margin: .25rem 0 1rem; background-color: #f3f3f3; width: 100%; height: 1px;"></div>
        <div style="margin: 20px auto; width: 80%;">
					<div id="reservation-table">
            <table style="width: 100%; border-collapse: collapse; text-align: center;">
							<thead>
                <tr style="background-color: #f9f9f9;">
									<th>예약 ID</th>
									<th>예약 상태</th>
									<th>예약 숙소</th>
									<th>대표 예약 옵션</th>
									<th>체크인 - 체크아웃</th>
									<th>예약자(인원)</th>
									<th>대표 투숙자</th>
									<th>판매 금액</th>
									<th>입금 금액</th>
									<th>예약 일시(KST)</th>
									<th>이용 여부</th>
									<th>리뷰 작성</th>
								</tr>
							</thead>
							<tbody id="reservation-list">
								<tr th:each="reservation : ${hotelReservations}"
										th:attr="data-checkout=${#dates.format(reservation.lr_checkout, 'yyyy-MM-dd')},
														data-state=${reservation.lr_state},
														data-lr-num=${reservation.lr_num},
														data-ld-name=${reservation.lr_ld_name},
														data-rm-name=${reservation.lr_rm_name}">
									<td th:text="${reservation.lr_me_name}"></td>
									<td th:text="${reservation.lr_state}"></td>
									<td th:text="${reservation.lr_ld_name}"></td>
									<td th:text="${reservation.lr_rm_name}"></td>
									<td th:text="${#dates.format(reservation.lr_checkin, 'yyyy-MM-dd') + ' - ' + #dates.format(reservation.lr_checkout, 'yyyy-MM-dd')}"></td>
									<td th:text="${reservation.lr_booker_name + '(' + reservation.lr_count + ')'}"></td>
									<td th:text="${reservation.lr_guest_name}"></td>
									<td th:text="${reservation.lr_total_price}"></td>
									<td th:text="${reservation.lr_total_price}"></td>
									<td th:text="${#dates.format(reservation.lr_date, 'yyyy-MM-dd HH:mm')}"></td>
									<td class="use-status-cell"></td>
								</tr>
							</tbody>
						</table>
					</div>
					<!-- 모달 -->
					<div id="modalOverlay">
						<div id="reviewModal">
							<input type="hidden" id="hiddenLrNumInput">

							<div>
								<strong>숙소 이름:</strong> <span id="lodgingName"></span><br>
								<strong>객실명:</strong> <span id="roomName"></span>
							</div>

							<div class="star-rating" onmouseleave="resetStars()">
								<span class="star" data-value="1" onmouseover="highlightStars(1)" onclick="selectRating(1)">★</span>
								<span class="star" data-value="2" onmouseover="highlightStars(2)" onclick="selectRating(2)">★</span>
								<span class="star" data-value="3" onmouseover="highlightStars(3)" onclick="selectRating(3)">★</span>
								<span class="star" data-value="4" onmouseover="highlightStars(4)" onclick="selectRating(4)">★</span>
								<span class="star" data-value="5" onmouseover="highlightStars(5)" onclick="selectRating(5)">★</span>
								<input type="hidden" id="ratingValue" name="rating" value="0">
							</div>

							<div>
								<label>리뷰 내용:</label><br>
								<textarea id="reviewContent" rows="5" cols="30"></textarea>
							</div>

							<button id="submitBtn" type="button" onclick="submitReview()">등록</button>

							<button id="updateBtn" type="button" style="display:none;" onclick="updateReview()">수정</button>
							<button id="deleteBtn" type="button" style="display:none;" onclick="deleteReview()">삭제</button>

							<button type="button" onclick="closeReviewModal()">취소</button>
						</div>
					</div>
					<!-- 렌트카 예약 테이블 -->
					<div id="rentcar-reservations" style="display:none;">
						<table style="width: 100%; border-collapse: collapse; text-align: center;">
							<thead>
								<tr style="background-color: #f9f9f9;">
									<th>예약 ID</th>
									<th>업체명</th>
									<th>차량명</th>
									<th>예약 상태</th>
									<th>대여 일시</th>
									<th>반납 일시</th>
									<th>예약자</th>
									<th>금액</th>
									<th>예약 일시(KST)</th>
									<th>이용 여부</th>
									<th>리뷰 작성</th>
								</tr>
							</thead>
							<tbody id="rentcar-reservation-list">
								<tr th:each="reservation : ${rentcarReservations}"
										th:attr="data-checkout=${#dates.format(reservation.rr_chekout, 'yyyy-MM-dd HH:mm')},
														data-state=${reservation.rr_state},
														data-rr-num=${reservation.rr_num},
														data-ct-name=${reservation.ct_name}">
									<td th:text="${reservation.rr_num}"></td>
									<td th:text="${reservation.re_name}"></td>
									<td th:text="${reservation.ct_name}"></td>
									<td th:text="${reservation.rr_state}"></td>
									<td th:text="${#dates.format(reservation.rr_checkIn, 'yyyy-MM-dd HH:mm')}"></td>
									<td th:text="${#dates.format(reservation.rr_chekout, 'yyyy-MM-dd HH:mm')}"></td>
									<td th:text="${reservation.rr_name}"></td>
									<td th:text="${reservation.rr_price}"></td>
									<td th:text="${#dates.format(reservation.rr_date, 'yyyy-MM-dd HH:mm')}"></td>
									<td class="use-status-cell"></td>
								</tr>
							</tbody>
						</table>
					</div>
					<!-- 렌트카 리뷰 모달 -->
					<div id="modalOverlayRental">
						<div id="reviewModalRental">
							<input type="hidden" id="hiddenRentalNumInput">

							<div>
								<strong>업체명:</strong> <span id="rental-name"></span><br>
								<strong>차량명:</strong> <span id="ctName"></span>
							</div>

							<div class="star-rating">
								<span class="star" data-value="1" onmouseover="highlightStarsRental(1)" onclick="selectRatingRental(1)">★</span>
								<span class="star" data-value="2" onmouseover="highlightStarsRental(2)" onclick="selectRatingRental(2)">★</span>
								<span class="star" data-value="3" onmouseover="highlightStarsRental(3)" onclick="selectRatingRental(3)">★</span>
								<span class="star" data-value="4" onmouseover="highlightStarsRental(4)" onclick="selectRatingRental(4)">★</span>
								<span class="star" data-value="5" onmouseover="highlightStarsRental(5)" onclick="selectRatingRental(5)">★</span>
							</div>

							<input type="hidden" id="ratingValueRental" value="0">

							<textarea id="reviewContentRental" placeholder="리뷰 내용을 입력하세요"></textarea>

							<button id="submitBtnRental" onclick="submitReviewRental()">등록</button>
							<button id="updateBtnRental" style="display:none;" onclick="updateReviewRental()">수정</button>
							<button id="deleteBtnRental" style="display:none;" onclick="deleteReviewRental()">삭제</button>
						</div>
					</div>
        </div>
    </div>
	<script>
		let activeTab = '호텔';
		let allReservations = [];
		let allRentReservations = [];

		window.changeTab = function(clickedTab) {
			const $tabs = $('.tab');
			$tabs.removeClass('active').css({ color: '#888', borderBottom: 'none' });
			$(clickedTab).addClass('active').css({ color: '#007bff', borderBottom: '2px solid #007bff' });

			activeTab = $(clickedTab).text();

			// 필터 초기화
			$('#reservation-state').val('전체');

			if (activeTab === '렌트카') {
					$('#reservation-table').hide();
					$('#rentcar-reservations').show();
					$('#no-reservation-message').hide();
					fetchRentcarReservations();
			} else {
					$('#rentcar-reservations').hide();
					$('#reservation-table').show();
					$('#no-reservation-message').hide();
					fetchNewReservations();
			}
	};

		function fetchNewReservations() {
				$.ajax({
						url: '/member/reservation-list-ajax',
						type: 'GET',
						success: function(reservations) {
								allReservations = reservations;
								renderReservationList(allReservations);
						}
				});
		}

		function fetchRentcarReservations() {
				$.ajax({
						url: '/member/rent-reservation-list-ajax',
						type: 'GET',
						success: function(reservations) {
								allRentReservations = reservations;
								renderRentReservationList(allRentReservations);
						}
				});
		}

		function renderReservationList(reservations) {
			const $list = $('#reservation-list');
			$list.empty();

			if (reservations.length === 0) {
				$list.html('<tr><td colspan="12">예약 내역이 없습니다.</td></tr>'); // colspan 변경
				return;
			}

			reservations.forEach(res => {
				const checkoutDate = new Date(res.lr_checkout);
				const today = new Date();

				checkoutDate.setHours(0, 0, 0, 0);
				today.setHours(0, 0, 0, 0);

				let reviewBtnHtml = "";
				let usageStatus = "";

				if (res.lr_state === "예약완료") {
					if (today > checkoutDate) {
						// 이용 완료
						usageStatus = `<span style="color: green; font-weight: bold;">이용 완료</span>`;
						reviewBtnHtml = `
							<button
								type="button"
								class="btn btn-outline-success review-btn"
								data-lr-num="${res.lr_ld_num}"
								data-lodging-name="${res.lr_ld_name}"
								data-room-name="${res.lr_rm_name}"
								onclick="openReviewModal(this)">
								리뷰 작성
							</button>
						`;
					} else {
						// 이용 전
						usageStatus = `<span style="color: #888;">이용 전</span>`;
						reviewBtnHtml = `
							<button
								type="button"
								class="btn btn-secondary"
								onclick="alert('체크아웃 이후에 리뷰 작성이 가능합니다.')">
								리뷰 작성 (불가)
							</button>
						`;
					}
				} else {
					// 예약취소 등
					usageStatus = `<span style="color: red;">예약 취소</span>`;
					reviewBtnHtml = `<span style="color: #aaa;">리뷰 작성 불가</span>`;
				}

				// 금액에 천 단위 콤마 추가 함수
				function formatPrice(price) {
					return price.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
				}

				const row = `
					<tr>
						<td>${res.lr_me_name}</td>
						<td>${res.lr_state}</td>
						<td>${res.lr_ld_name}</td>
						<td>${res.lr_rm_name}</td>
						<td>${formatDate(res.lr_checkin)} - ${formatDate(res.lr_checkout)}</td>
						<td>${res.lr_booker_name}(${res.lr_count})</td>
						<td>${res.lr_guest_name}</td>
						<td>${formatPrice(res.lr_total_price)}</td>
						<td>${formatPrice(res.lr_total_price)}</td>
						<td>${formatDateTime(res.lr_date)}</td>
						<td>${usageStatus}</td>
						<td>${reviewBtnHtml}</td>
					</tr>
				`;

				$list.append(row);
			});
		}

		function renderRentReservationList(reservations) {
			const $list = $('#rentcar-reservation-list');
			$list.empty();

			if (reservations.length === 0) {
				$list.html('<tr><td colspan="12">렌트카 예약 내역이 없습니다.</td></tr>'); // colspan 12로 맞춤
				return;
			}

			// 천 단위 콤마 함수
			function formatPrice(price) {
				return price.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
			}

			reservations.forEach(res => {
				const checkoutDate = new Date(res.rr_chekout);
				const today = new Date();

				checkoutDate.setHours(0, 0, 0, 0);
				today.setHours(0, 0, 0, 0);

				let usageStatus = "";
				let reviewBtnHtml = "";

				if (res.rr_state === "예약완료") {
					if (today > checkoutDate) {
						usageStatus = `<span style="color: green; font-weight: bold;">이용 완료</span>`;
						reviewBtnHtml = `
							<button
								type="button"
								class="btn btn-outline-success review-btn"
								data-rental-num="${res.rr_num}"
								data-rental-name="${res.re_name}"
								data-ct-name="${res.ct_name}"
								onclick="openReviewModalRental(this)">
								리뷰 작성
							</button>
						`;
					} else {
						usageStatus = `<span style="color: #888;">이용 전</span>`;
						reviewBtnHtml = `
							<button
								type="button"
								class="btn btn-secondary"
								onclick="alert('차량 반납 이후에 리뷰 작성이 가능합니다.')">
								리뷰 작성 (불가)
							</button>
						`;
					}
				} else {
					usageStatus = `<span style="color: red;">예약 취소</span>`;
					reviewBtnHtml = `<span style="color: #aaa;">리뷰 작성 불가</span>`;
				}

				const row = `
					<tr>
						<td>${res.rr_num}</td>
						<td>${res.re_name}</td>
						<td>${res.ct_name}</td>
						<td>${res.rr_state}</td>
						<td>${formatDateTime(res.rr_checkIn)}</td>
						<td>${formatDateTime(res.rr_chekout)}</td>
						<td>${res.rr_name}</td>
						<td>${formatPrice(res.rr_price)}원</td>
						<td>${formatDateTime(res.rr_date)}</td>
						<td>${usageStatus}</td>
						<td>${reviewBtnHtml}</td>
					</tr>
				`;

				$list.append(row);
			});
		}

		function filterReservations() {
				if (activeTab === '호텔') {
						const selectedState = $('#reservation-state').val();
						let filteredReservations;

						if (selectedState === '전체') {
								filteredReservations = allReservations;
						} else if (selectedState === '예약완료') {
								filteredReservations = allReservations.filter(res => res.lr_state === '예약완료');
						} else if (selectedState === '취소/환불') {
								filteredReservations = allReservations.filter(res => res.lr_state === '예약취소');
						}
						renderReservationList(filteredReservations);
				} else if (activeTab === '렌트카') {
						const selectedState = $('#reservation-state').val();
						let filteredRentReservations;

						if (selectedState === '전체') {
								filteredRentReservations = allRentReservations;
						} else if (selectedState === '예약완료') {
								filteredRentReservations = allRentReservations.filter(res => res.rr_state === '예약완료');
						} else if (selectedState === '취소/환불') {
								filteredRentReservations = allRentReservations.filter(res => res.rr_state === '예약취소');
						}
						renderRentReservationList(filteredRentReservations);
				}
		}

		function formatDate(dateStr) {
				const date = new Date(dateStr);
				const year = date.getFullYear();
				const month = String(date.getMonth() + 1).padStart(2, '0');
				const day = String(date.getDate()).padStart(2, '0');
				return `${year}-${month}-${day}`;
		}

		function formatDateTime(dateStr) {
				const date = new Date(dateStr);
				return (
						date.getFullYear() + '-' +
						String(date.getMonth() + 1).padStart(2, '0') + '-' +
						String(date.getDate()).padStart(2, '0') + ' ' +
						String(date.getHours()).padStart(2, '0') + ':' +
						String(date.getMinutes()).padStart(2, '0')
				);
		}

		$(document).ready(function() {
				fetchNewReservations();
		});
		</script>
		<script>
			function openReviewModal(btn) {
				const lrNum = parseInt($(btn).data("lr-num"));
				const lodgingName = $(btn).data("lodging-name");
				const roomName = $(btn).data("room-name");

				$("#hiddenLrNumInput").val(lrNum);
				$("#lodgingName").text(lodgingName);
				$("#roomName").text(roomName);

				// 초기화
				$("#reviewContent").val("");
				$("#ratingValue").val(0);
				$(".star").removeClass("selected hover");

				// 버튼 초기화
				$("#submitBtn").show();
				$("#updateBtn, #deleteBtn").hide();

				$.ajax({
					url: "/review/detail",
					type: "GET",
					data: { rv_number: lrNum, rv_table_name: 'room' },
					success: function(review) {
						if (review && review.rv_number) { // 존재 여부를 정확히 체크
							$("#reviewContent").val(review.rv_content);
							$("#ratingValue").val(review.rv_rating);
							currentRating = review.rv_rating;
							resetStars();

							$("#submitBtn").hide();
							$("#updateBtn, #deleteBtn").show();
						}
					},
					error: function () {
						alert("리뷰 정보 불러오기 실패");
					}
				});

				$("#modalOverlay").show();
				$("#reviewModal").show();
			}

			function closeReviewModal() {
				$('#modalOverlay').fadeOut();
				$('#reviewModal').fadeOut();
				$('#hiddenLrNumInput').val('');
				$('#reviewContent').val('');
				$('input[name="rating"]').prop('checked', false);
				$('#lodgingName').text('');
				$('#roomName').text('');
				
				currentRating = 0;
				resetStars();
			}

			$('#modalOverlay').on('click', function () {
				closeReviewModal();
			});

			$(document).on('keydown', function (e) {
				if (e.key === "Escape") {
					closeReviewModal();
				}
			});

			$('#reviewModal').on('click', function (event) {
				event.stopPropagation();
			});

			let currentRating = 0;

			function highlightStars(rating) {
				const stars = document.querySelectorAll('.star-rating .star');
				stars.forEach(star => {
					const val = parseInt(star.getAttribute('data-value'));
					star.classList.toggle('hover', val <= rating);
				});
			}

			function resetStars() {
				const stars = document.querySelectorAll('.star-rating .star');
				stars.forEach(star => {
					const val = parseInt(star.getAttribute('data-value'));
					star.classList.remove('hover');
					star.classList.toggle('selected', val <= currentRating);
				});
			}

			function selectRating(rating) {
				currentRating = rating;
				document.getElementById('ratingValue').value = rating;
				resetStars();
			}
			
			function updateReview() {
				const rating = $("#ratingValue").val();
				const content = $("#reviewContent").val();
				const rv_number = $("#hiddenLrNumInput").val();
				const rv_me_num = $("#hiddenMeNum").val(); // 숨겨진 input에 회원 번호 저장되어 있어야 함
				const rv_table_name = "room"; // 혹은 동적으로 설정되게

				$.ajax({
						url: "/review/update",
						type: "POST",
						data: {
								rv_rating: rating,
								rv_content: content,
								rv_number: rv_number,
								rv_me_num: rv_me_num,
								rv_table_name: rv_table_name
						},
						success: function(res) {
								if (res === "success") {
										alert("리뷰가 수정되었습니다!");
										closeReviewModal();
								} else {
										alert("리뷰 수정 실패");
								}
						}
				});
			}

			function deleteReview() {
				const rv_number = $("#hiddenLrNumInput").val();

				if (!confirm("리뷰를 삭제하시겠습니까?")) return;

				$.ajax({
					url: "/review/delete",
					type: "POST",
					data: {
						rv_number: rv_number
					},
					success: function(res) {
						if(res === "success") {
							alert("리뷰가 삭제되었습니다.");
							closeReviewModal();
						} else {
							alert("삭제 실패");
						}
					}
				});
			}

			function submitReview() {
				const lrNum = $('#hiddenLrNumInput').val();
				const rating = parseInt($('#ratingValue').val());
				const content = $('#reviewContent').val();

				if (!rating || rating < 1) {
					alert('별점은 최소 1점 이상 선택해야 합니다!');
					return;
				}

				if (!content.trim()) {
					alert('리뷰 내용을 입력해주세요!');
					return;
				}

				$.ajax({
					url: '/review/insert',
					type: 'POST',
					data: {
						rv_rating: rating,
						rv_content: content,
						rv_table_name: 'room',
						rv_number: lrNum
					},
					success: function (res) {
						if (res === 'success') {
							alert('리뷰가 등록되었습니다!');
							closeReviewModal();
						} else if (res === 'invalid_rating') {
							alert('서버 응답: 별점은 최소 1점 이상이어야 합니다.');
						} else if (res === 'invalid_content') {
							alert('서버 응답: 리뷰 내용을 입력해주세요.');
						} else {
							alert('리뷰 등록 실패. 다시 시도해주세요!');
						}
					},
					error: function () {
						alert('서버 오류. 잠시 후 다시 시도해주세요.');
					}
				});
			}
		</script>
		<script>
			function openReviewModalRental(btn) {
				const rentalNum = parseInt($(btn).data("rentalNum"));
				const rentalName = $(btn).data("rental-name");
				const carTypeName = $(btn).data("ctName");
				if (isNaN(rentalNum)) {
						alert("예약 번호가 유효하지 않습니다.");
						return;
				}

				$("#rental-name").text(rentalName);
				$("#ctName").text(carTypeName);
				$("#hiddenRentalNumInput").val(rentalNum);

				$("#reviewContentRental").val("");
				$("#ratingValueRental").val(0);
				$("#reviewModalRental .star").removeClass("selected hover");

				$("#submitBtnRental").show();
				$("#updateBtnRental, #deleteBtnRental").hide();

				$.ajax({
						url: "/review/detail",
						type: "GET",
						data: { rv_number: rentalNum, rv_table_name: 'rental' },
						success: function(review) {
								if (review && review.rv_number) {
										$("#reviewContentRental").val(review.rv_content);
										$("#ratingValueRental").val(review.rv_rating);
										currentRatingRental = review.rv_rating;
										resetStarsRental();

										$("#submitBtnRental").hide();
										$("#updateBtnRental, #deleteBtnRental").show();
								}
								$("#modalOverlayRental").show();
								$("#reviewModalRental").show();
						},
						error: function () {
								alert("리뷰 정보 불러오기 실패");
								$("#modalOverlayRental").show();
								$("#reviewModalRental").show();
						}
				});
		}

			// 닫기 함수
			function closeReviewModalRental() {
				$("#modalOverlayRental").fadeOut();
				$("#reviewModalRental").fadeOut();
				$("#hiddenRentalNumInput").val("");
				$("#reviewContentRental").val("");
				$("#ratingValueRental").val(0);
				$("#reviewModalRental .star").removeClass("selected hover");
				
				currentRatingRental = 0;
				resetStarsRental();
			}

			// 모달 닫기 이벤트
			$("#modalOverlayRental").on("click", closeReviewModalRental);
			$(document).on("keydown", function (e) {
				if (e.key === "Escape") {
					closeReviewModalRental();
				}
			});
			$("#reviewModalRental").on("click", function (e) {
				e.stopPropagation();
			});

			// 별점 상태 변수
			let currentRatingRental = 0;

			// 별점 하이라이트
			function highlightStarsRental(rating) {
				$("#reviewModalRental .star").each(function () {
					const val = parseInt($(this).data("value"));
					$(this).toggleClass("hover", val <= rating);
				});
			}

			// 별점 초기화 및 선택 상태 표시
			function resetStarsRental() {
				$("#reviewModalRental .star").each(function () {
					const val = parseInt($(this).data("value"));
					$(this).removeClass("hover");
					$(this).toggleClass("selected", val <= currentRatingRental);
				});
			}

			// 별점 선택
			function selectRatingRental(rating) {
				currentRatingRental = rating;
				$("#ratingValueRental").val(rating);
				resetStarsRental();
			}

			// 리뷰 등록
			function submitReviewRental() {
				const rentalNum = $("#hiddenRentalNumInput").val();
				const rating = parseInt($("#ratingValueRental").val());
				const content = $("#reviewContentRental").val();

				// 프론트 1차 유효성 검사
				if (!rating || rating < 1) {
					alert("별점은 최소 1점 이상 선택해야 합니다!");
					return;
				}

				if (!content.trim()) {
					alert("리뷰 내용을 입력해주세요!");
					return;
				}

				$.ajax({
					url: "/review/insert",
					type: "POST",
					data: {
						rv_rating: rating,
						rv_content: content,
						rv_table_name: "rental",
						rv_number: rentalNum
					},
					success: function (res) {
						if (res === "success") {
							alert("리뷰가 등록되었습니다!");
							closeReviewModalRental();
						} else if (res === "invalid_rating") {
							alert("서버 측 유효성 검사 실패: 별점은 1~5점 사이여야 합니다.");
						} else if (res === "invalid_content") {
							alert("서버 측 유효성 검사 실패: 리뷰 내용을 입력해주세요.");
						} else {
							alert("리뷰 등록 실패. 다시 시도해주세요!");
						}
					},
					error: function () {
						alert("서버 오류. 잠시 후 다시 시도해주세요.");
					}
				});
			}

			function updateReviewRental() {
				const rating = parseInt($("#ratingValueRental").val());
				const content = $("#reviewContentRental").val();
				const rv_number = $("#hiddenRentalNumInput").val();
				const tableName = "rental";

				if (!rating || rating < 1) {
					alert("별점은 최소 1점 이상 선택해야 합니다!");
					return;
				}
				if (!content.trim()) {
					alert("리뷰 내용을 입력해주세요!");
					return;
				}

				$.ajax({
					url: "/review/update",
					type: "POST",
					data: {
						rv_rating: rating,
						rv_content: content,
						rv_number: rv_number,
						rv_table_name: tableName
					},
					success: function (res) {
						if (res === "success") {
							alert("리뷰가 수정되었습니다!");
							closeReviewModalRental();
						} else if (res === "invalid_rating") {
							alert("별점은 1점 이상 5점 이하로 입력해주세요.");
						} else if (res === "invalid_content") {
							alert("리뷰 내용을 입력해주세요.");
						} else {
							alert("리뷰 수정 실패. 다시 시도해주세요!");
						}
					},
					error: function () {
						alert("서버 오류 발생. 잠시 후 다시 시도해주세요.");
					}
				});
			}

			// 리뷰 삭제
			function deleteReviewRental() {
				const rv_number = $("#hiddenRentalNumInput").val();

				if (!confirm("리뷰를 삭제하시겠습니까?")) return;

				$.ajax({
					url: "/review/delete",
					type: "POST",
					data: {
						rv_number: rv_number
					},
					success: function (res) {
						if (res === "success") {
							alert("리뷰가 삭제되었습니다.");
							closeReviewModalRental();
						} else {
							alert("삭제 실패");
						}
					}
				});
			}
		</script>
