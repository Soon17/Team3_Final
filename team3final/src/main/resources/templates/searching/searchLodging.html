<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8">

  </style>
</head>

<body>
  <input type="hidden" th:value="${lodgingList.size()}" id="lo-size">
  <div class="im" th:each="ld : ${lodgingList}">
    <a href="#" class="card-link" th:data-ld-num="${ld.ld_num}" th:data-ld-region="${ld.ld_region}">
      <div class="hotel-image">
        <img class="poto" th:src="@{${ld.main_thumbnail} + ${ld.th_name}}" alt="호텔1">
      </div>
      <div class="hotel-info">
        <div class="hotel-up">
          <div class="hotel-name" th:text="${ld.ld_name}"></div>
          <div class="hotel-grade">
            <img class="star" src="/resources/static/imgs/star.svg" alt="star">
            <span class="review-score" th:text="${ld.avg_rating}"></span>
            <span class="hotel-stars">
              <span th:if="${ld.ld_type == '호텔'}" style="margin-left: 5px;">[[${ld.ld_rating}]]성급</span>
              <span th:if="${ld.ld_type != '호텔'}" style="margin-left: 5px;">[[${ld.ld_type}]]</span>
            </span>
          </div>
        </div>
        <div class="hotel-price">
          <span class="price" th:text="${#numbers.formatInteger(ld.min_price, 3, 'COMMA')} + '원'"></span> /1박
        </div>
      </div>
    </a>
  </div>
</body>

</html>
