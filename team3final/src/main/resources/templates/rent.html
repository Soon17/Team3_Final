<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout.html}" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>카모아 - 국내도 해외도 렌트카</title>
	<link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
	<script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
	<style>
		.lodging-name {
			/*나중에 car-name으로 바꾸셈 ajax*/
			display: block;
			width: 100%;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			font-size: 18px;
			font-weight: 700;
			color: #494949;
		}

		.calendar-wrapper {
			background: white;
			max-width: 700px;
			margin: auto;
			padding: 20px;
			border-radius: 15px;
			box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
		}

		.modal-header {
			margin-bottom: 20px;
			font-size: 18px;
			font-weight: bold;
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.calendar-grid {
			display: grid;
			grid-template-columns: 1fr;
			gap: 30px;
			max-height: 600px;
			overflow-y: auto;
			padding-right: 10px;
		}

		.month {
			border: 1px solid #ddd;
			border-radius: 10px;
			padding: 10px;
			background: #fff;
		}

		.month h3 {
			text-align: center;
			margin: 0 0 10px;
		}

		.days {
			display: grid;
			grid-template-columns: repeat(7, 1fr);
			gap: 5px;
		}

		.day,
		.day-name {
			text-align: center;
			padding: 8px 0;
		}

		.day:hover {
			cursor: pointer;
		}

		.day-name {
			font-weight: bold;
			background-color: #f8f8f8;
		}

		.day.disabled {
			color: #ccc;
			cursor: not-allowed;
		}

		.day.selected {
			background-color: #007aff;
			color: white;
			border-radius: 10px;
		}

		.day.in-range {
			background-color: rgba(0, 122, 255, 0.3);
			border-radius: 10px;
		}

		.apply-btn {
			width: 100%;
			padding: 15px;
			background-color: #007aff;
			color: white;
			font-size: 16px;
			border: none;
			margin-top: 20px;
			border-radius: 10px;
			cursor: pointer;
		}

		.event-swiper {
			width: 100%;
			height: auto;
			position: relative;
		}

		.swiper-slide {
			position: relative;
		}

		.swiper-slide .card:hover {
			text-decoration: none;
		}

		.link {
			display: flex;
			justify-content: center;
			/* 가로 중앙 */
			width: 100%;
			height: 100%;
		}

		.link img {
			width: 100%;
			max-height: 100%;
			max-width: 1032px;
			object-fit: fill;
		}

		.event-swiper .swiper-slide.first {
			background-color: rgb(255, 226, 213);
		}

		.event-swiper .swiper-slide.second {
			background-color: rgb(215, 225, 255);
		}

		.event-swiper .swiper-slide.third {
			background-color: rgb(34, 97, 228);
		}

		.event-swiper .event-next,
		.event-prev {
			opacity: 0;
			transition: .2s;
		}

		.event-swiper:hover .event-prev,
		.event-swiper:hover .event-next {
			opacity: 1;
		}

		.event-next::after,
		.event-prev::after,
		.car-next::after,
		.car-prev::after,
		.money-next::after,
		.money-prev::after,
		.booking-next::after,
		.booking-prev::after {
			display: none;
		}

		.event-next,
		.car-next,
		.money-next,
		.booking-next {
			right: calc(50% - 516px - 2.5rem);
			border-radius: 2.5rem;
			width: 2.5rem;
			height: 2.5rem;
			background-repeat: no-repeat;
			background-size: 100% auto;
			background-position: center;
			box-shadow: 0 4px 14px 0 rgba(0, 0, 0, .2);
			cursor: pointer;
			position: absolute;
			-ms-transform: translate(0, -50%);
			transform: translate(0, -50%);
			z-index: 1;
			background-image: url(data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHZpZXdCb3g9IjAgMCA0MCA0MCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPGNpcmNsZSBjeD0iMjAiIGN5PSIyMCIgcj0iMjAiIGZpbGw9IndoaXRlIiBmaWxsLW9wYWNpdHk9IjAuOSIvPgo8cGF0aCBkPSJNMTggMTRMMjQgMjBMMTggMjYiIHN0cm9rZT0iIzk5OTk5OSIgc3Ryb2tlLXdpZHRoPSIyIi8+Cjwvc3ZnPgo=);

		}

		.event-prev,
		.car-prev,
		.money-prev,
		.booking-prev {
			border-radius: 2.5rem;
			width: 2.5rem;
			height: 2.5rem;
			background-repeat: no-repeat;
			background-size: 100% auto;
			background-position: center;
			box-shadow: 0 4px 14px 0 rgba(0, 0, 0, .2);
			cursor: pointer;
			position: absolute;
			-ms-transform: translate(0, -50%);
			transform: translate(0, -50%);
			z-index: 1;
			left: calc(50% - 516px - 2.5rem);
			background-image: url(data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHZpZXdCb3g9IjAgMCA0MCA0MCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPGNpcmNsZSByPSIyMCIgdHJhbnNmb3JtPSJtYXRyaXgoLTEgMCAwIDEgMjAgMjApIiBmaWxsPSJ3aGl0ZSIgZmlsbC1vcGFjaXR5PSIwLjkiLz4KPHBhdGggZD0iTTIyIDE0TDE2IDIwTDIyIDI2IiBzdHJva2U9IiM5OTk5OTkiIHN0cm9rZS13aWR0aD0iMiIvPgo8L3N2Zz4K);
		}

		.region-car {
			margin-top: 100px;
		}

		.region-text {
			width: 100%;
			max-width: 1032px;
			margin: 0 auto;
		}

		.region-btn {
			background-color: #f1f1f1;
			border: none;
			padding: 8px 16px;
			margin-right: 8px;
			border-radius: 6px;
			cursor: pointer;
		}

		.region-btn.active {
			background-color: #6b7ba3;
			color: white;
		}

		#check-time:hover,
		#region:hover {
			cursor: pointer;
		}

		#region {
			position: relative;
		}

		@media screen and (max-width: 1080px) {

			.event-next,
			.car-next,
			.money-next,
			.booking-next {
				display: none;
			}

			.region-text {
				max-width: 1080px;
				width: 100%;
			}
		}
	</style>
</head>

<body>
	<div layout:fragment="content">
		<div class="modal" id="calendarModal">
			<div class="modal-dialog">
				<div class="modal-content">
					<!-- Modal 헤더 -->
					<div class="modal-header">
						<div>
							<span id="start-date">날짜 선택</span> ~ <span id="end-date"></span>
						</div>
						<div class="nights" id="nights"></div>
						<button type="button" class="close" data-dismiss="modal">&times;</button>
					</div>
					<!-- Modal 바디 -->
					<div class="modal-body">
						<div class="calendar-wrapper">
							<div id="calendar-grid" class="calendar-grid"></div>
						</div>
					</div>
					<!-- Modal 푸터 -->
					<div class="modal-footer justify-content-center">
						<button type="button" class="apply-btn" onclick="applySelection()" data-dismiss="modal">적용하기</button>
					</div>
				</div>
			</div>
		</div>
		<div class="modal" id="guestModal">
			<div class="modal-dialog">
				<div class="modal-content">
					<!-- Modal 헤더 -->
					<div class="modal-header">
						<div>
							<span>인원 선택</span>
						</div>
						<button type="button" class="close" data-dismiss="modal">&times;</button>
					</div>
					<!-- Modal 바디 -->
					<div class="modal-body">
						<div>
							<div class="counter-label">성인</div>
							<div class="counter-subtext">만 18세 이상</div>
						</div>
						<div class="counter-controls">
							<div class="counter-btn" id="adult-minus">−</div>
							<div class="count-value" id="adult-count">2</div>
							<div class="counter-btn" id="adult-increase">+</div>
						</div>
					</div>
					<!-- Modal 푸터 -->
					<div class="modal-footer justify-content-center">
						<button type="button" id="confirm-btn" data-dismiss="modal">적용하기</button>
					</div>
				</div>
			</div>
		</div>
		<div>
			<div class="swiper event-swiper d-md-flex">
				<div class="swiper-wrapper">
					<div class="swiper-slide first">
						<a class="link" href="/event/detail/4">

						</a>
					</div>
					<div class="swiper-slide second">
						<a class="link" href="/event/detail/5">

						</a>
					</div>
					<div class="swiper-slide third">

						</a>
					</div>
				</div>
				<div class="swiper-button-prev event-prev"></div>
				<div class="swiper-button-next event-next"></div>

			</div>

		<script>
			let regionName;
			$('#search-btn').on('click', function (e) {
				const time = $('#check-time').val();
				if (time.trim().length == 0) {
					e.preventDefault(); // submit 막음
					alert('날짜를 입력해주세요');
				}
			});
			const today = new Date();
			today.setHours(0, 0, 0, 0);

			let selectedStart = null;
			let selectedEnd = null;

			function formatDate(date) {
				const y = date.getFullYear();
				const m = String(date.getMonth() + 1).padStart(2, '0');
				const d = String(date.getDate()).padStart(2, '0');
				const w = ['일', '월', '화', '수', '목', '금', '토'][date.getDay()];
				return `${y}.${m}.${d}(${w})`;
			}

			function createCalendar(year, month) {
				const $monthContainer = $('<div class="month"></div>');
				const $monthTitle = $('<h3></h3>').text(`${year}.${month + 1}`);
				const $daysGrid = $('<div class="days"></div>');

				const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
				$.each(dayNames, (_, day) => {
					$daysGrid.append($('<div class="day-name"></div>').text(day));
				});

				const firstDay = new Date(year, month, 1);
				const lastDay = new Date(year, month + 1, 0);

				for (let i = 0; i < firstDay.getDay(); i++) {
					$daysGrid.append('<div></div>');
				}

				for (let d = 1; d <= lastDay.getDate(); d++) {
					const date = new Date(year, month, d);
					const $dayEl = $('<div class="day"></div>').text(d);

					if (date < today) {
						$dayEl.addClass('disabled');
					} else {
						$dayEl.on('click', function () {
							selectDate(date);
						});
					}

					$daysGrid.append($dayEl);
				}

				$monthContainer.append($monthTitle).append($daysGrid);
				$('#calendar-grid').append($monthContainer);
			}

			function renderCalendars() {
				const startYear = today.getFullYear();
				const startMonth = today.getMonth();

				for (let i = 0; i < 12; i++) {
					const year = startYear + Math.floor((startMonth + i) / 12);
					const month = (startMonth + i) % 12;
					createCalendar(year, month);
				}
			}

			function selectDate(date) {
				if (!selectedStart || (selectedStart && selectedEnd)) {
					selectedStart = date;
					selectedEnd = null;
				} else {
					if (date < selectedStart) {
						selectedStart = date;
						selectedEnd = null;
					} else {
						const diff = (date - selectedStart) / (1000 * 60 * 60 * 24);
						if (diff > 30) {
							alert('최대 30일까지만 선택 가능합니다.');
							return;
						}
						selectedEnd = date;
					}
				}
				updateSelection();
			}

			function updateSelection() {
				$('.day').removeClass('selected in-range');

				if (selectedStart) {
					$('.month').each(function () {
						const [year, month] = $(this).find('h3').text().split('.').map(Number);
						$(this).find('.day').each(function () {
							const dayNum = parseInt($(this).text());
							const date = new Date(year, month - 1, dayNum);

							if (selectedStart && !selectedEnd && date.getTime() === selectedStart.getTime()) {
								$(this).addClass('selected');
							}
							if (selectedStart && selectedEnd) {
								if (date.getTime() === selectedStart.getTime() || date.getTime() === selectedEnd.getTime()) {
									$(this).addClass('selected');
								} else if (date > selectedStart && date < selectedEnd) {
									$(this).addClass('in-range');
								}
							}
						});
					});
				}

				$('#start-date').text(selectedStart ? formatDate(selectedStart) : '날짜 선택');
				$('#end-date').text(selectedEnd ? formatDate(selectedEnd) : '');
				if (selectedStart && selectedEnd) {
					const nights = (selectedEnd - selectedStart) / (1000 * 60 * 60 * 24);
					$('#nights').text(`${nights}박`);
				} else {
					$('#nights').text('');
				}
			}

			function applySelection() {
				if (selectedStart && selectedEnd) {
					//아이디를 해당 인풋 아이디로 하시면 도ㅣ요
					$('#check-time').val(`${formatDate(selectedStart)} ~ ${formatDate(selectedEnd)}`);

				} else {
					alert('날짜를 선택해주세요.');
				}
			}

			$(document).ready(function () {
				renderCalendars();
				selectedStart = new Date(today); // 오늘
				selectedEnd = new Date(today);   // 오늘 + 1일
				selectedEnd.setDate(selectedEnd.getDate() + 1);

				updateSelection();
				applySelection();

			$(document).ready(function () {
				$('.region-btn').click(function () {
					$(this).siblings().removeClass('active'); // 모든 버튼에서 active 제거
					$(this).addClass('active'); // 클릭한 버튼만 active 추가
					const type = $(this).parent().data('sw');
					const rg_num = $(this).data('id');
					regionName = $(this).text().trim();
					var $target = $(this).parent().next().find(".swiper")
					if (type === "hotel-review") {
						$.ajax({
							async: false,
							url: "/regionLodging",
							type: 'GET',
							data: {
								rg_num: rg_num,
								type: "review"
							},
							success: function (data) {
								$target.html(data);
								swiper2 = reloadSwiper(swiper2, ".car-swiper", swiperOption2);
								updateCardLinks();
							}
						});
					}
					else {
						$.ajax({
							async: false,
							url: "/regionRentCar",
							type: 'GET',
							data: {
								rg_num: rg_num,
								type: type
							},
							success: function (data) {
								$target.html(data);
								switch (type) {
									case 'rent-price':
										swiper3 = reloadSwiper(swiper3, ".money-swiper", swiperOption3);
										break;
									case 'rent-trend':
										swiper4 = reloadSwiper(swiper4, ".booking-swiper", swiperOption4);
										break;
								}
								updateRentLinks();
							}
						});
					}
				});
				$(".region-btn-box").each(function () {
					$(this).children().first().trigger("click")
				});
			});
			function reloadSwiper(swiper, selector, option) {
				if (swiper) {
					swiper.destroy(true, true);
				}
				swiper = new Swiper(selector, option);
			}
			function updateRentLinks() {	// 렌트 스와이퍼 링크 달아주기
				// url 바꿔야 함 마지막에		
				const checkTime = $('#check-time').val();
				const qR = encodeURIComponent(regionName);
				const qT = encodeURIComponent(checkTime);

				$('.rent-reserv-link').each(function () {
					$(this).attr(
						'href',
						`/searching/carsearch?rg_name=${qR}&checkTime=${qT}`
					);
				});
			}
			function updateCardLinks() {	//호텔 스와이퍼 링크 달아주기		
				const checkTime = $('#check-time').val()
				const people = "성인2"
				const qR = encodeURIComponent(regionName);
				const qT = encodeURIComponent(checkTime);
				const qP = encodeURIComponent(people);

				$('.reserv-link').each(function () {
					const ld_num = $(this).data('ld-num');
					const ld_region = encodeURIComponent($(this).data('ld-region'));
					$(this).attr(
						'href',
						`/reserv?rg_name=${qR}&checkTime=${qT}&rm_person=${qP}&ld_num=${ld_num}&ld_region=${ld_region}`
					);
				});
			}
		</script>
	</div>
</body>

</html>
