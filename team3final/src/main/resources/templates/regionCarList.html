<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8">
 
  </style>
</head>

<body>
  <div class="swiper-wrapper swiper-lodging">
    <div class="swiper-slide" th:each="cr : ${carList}">
      <a class="card rent-reserv-link" style="border: 0; overflow: hidden;"href="#" th:data-ld-num="${cr.cr_id}">
        <img th:src="@{/resources/static/imgs/{image}(image=${cr.cr_thumbnail})}" class="card-img-top"
          style="max-width: 240px; width: 100%; height: 150px; border-radius: 16px;" alt="썸네일">
        <div class="card-body p-2">
          <h6 class="mb-1 fw-bold car-name" th:text="${cr.ct_name}"></h6>
          <div>
            <span class="mb-0 text-muted" style="font-size: 14px;">[[${cr.cr_year}]]년식</span>
          </div>
          <p class="mb-0" th:text="|${#numbers.formatInteger(cr.cr_price, 3, 'COMMA')}원|"
          style="font-size: 18px; font-weight: 700; color: #9f1f13;"></p>
        </div>
      </a>
    </div>  
</body>

</html>
